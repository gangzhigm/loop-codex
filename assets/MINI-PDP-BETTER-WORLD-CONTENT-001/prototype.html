<!doctype html>
<html lang="zh-CN" data-layout="aligned" data-view="mini">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better World 小程序按钮与弹窗版本</title>
  <style>
:root {
  --rs-red: #b5122b;
  --rs-red-dark: #930c22;
  --rs-red-bright: #e30613;
  --ink: #252525;
  --muted: #666666;
  --line: #d3d3d3;
  --better-green: #087a2d;
  --better-green-dark: #075e28;
  --better-mint: #d4f5d6;
  --better-panel: #ecfaed;
  --link: #1d5fbf;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  background: #ffffff;
}

body {
  min-width: 320px;
  margin: 0;
  color: var(--ink);
  background: #ffffff;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  letter-spacing: 0;
}

button {
  font: inherit;
  letter-spacing: 0;
}

button:focus-visible {
  outline: 3px solid #111111;
  outline-offset: 3px;
}

.prototype {
  width: 100%;
  overflow: hidden;
}

.desktop-reference {
  position: relative;
  width: 100%;
  min-width: 800px;
  aspect-ratio: 3642 / 2486;
  overflow: hidden;
  background: #f7f7f7;
}

.reference-image {
  position: absolute;
  top: -7.24%;
  left: 0;
  display: block;
  width: 100%;
  height: auto;
}

.better-world-replacement {
  position: absolute;
  left: 17.45%;
  top: 67.50%;
  width: 17.9%;
  height: 8.45%;
  display: flex;
  align-items: flex-start;
  padding: clamp(4px, .45vw, 9px) clamp(8px, .8vw, 16px);
  background: #eeeeee;
}

html[data-layout="aligned"] .better-world-replacement {
  width: 17.5%;
  padding-right: 0;
  padding-left: 0;
}

.better-world-trigger {
  position: relative;
  display: flex;
  width: 100%;
  min-width: 0;
  height: 100%;
  min-height: 64px;
  align-items: center;
  gap: clamp(7px, .65vw, 12px);
  padding: clamp(7px, .65vw, 12px) clamp(9px, .8vw, 15px);
  color: var(--better-green);
  text-align: left;
  background: #f5fff6;
  border: 1px solid #8cb994;
  border-left: 4px solid var(--better-green);
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(22, 82, 38, .13);
  cursor: pointer;
  transition: background-color .16s ease, border-color .16s ease,
    box-shadow .16s ease, transform .16s ease;
}

.better-world-trigger:hover {
  background: #eaffec;
  border-color: var(--better-green);
  box-shadow: 0 5px 12px rgba(22, 82, 38, .20);
  transform: translateY(-1px);
}

.better-world-trigger:active {
  background: #def8e1;
  box-shadow: 0 1px 3px rgba(22, 82, 38, .16);
  transform: translateY(0);
}

.trigger-content {
  display: grid;
  min-width: 0;
  gap: clamp(3px, .3vw, 5px);
}

.trigger-title {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: clamp(5px, .45vw, 8px);
}

.trigger-title strong {
  min-width: 0;
  color: var(--better-green);
  font-size: clamp(10px, .82vw, 14px);
  font-weight: 900;
  line-height: 1.15;
  white-space: nowrap;
}

.trigger-copy {
  display: -webkit-box;
  overflow: hidden;
  color: #3c3c3c;
  font-size: clamp(8px, .66vw, 11px);
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.rs-mark {
  display: inline-grid;
  width: 38px;
  height: 38px;
  place-items: center;
  color: #ffffff;
  background: var(--rs-red-bright);
  font-size: 19px;
  font-weight: 900;
  line-height: 1;
}

.rs-mark--small {
  position: static;
  width: clamp(19px, 1.45vw, 25px);
  height: clamp(19px, 1.45vw, 25px);
  flex: 0 0 auto;
  font-size: clamp(9px, .7vw, 12px);
}

.trigger-chevron {
  width: clamp(9px, .65vw, 12px);
  height: clamp(9px, .65vw, 12px);
  flex: 0 0 auto;
  margin-left: auto;
  border-top: 2px solid currentColor;
  border-right: 2px solid currentColor;
  transform: rotate(45deg);
}

.mobile-reference {
  display: none;
}

.dialog-backdrop[hidden] {
  display: none;
}

.dialog-backdrop {
  position: fixed;
  z-index: 20;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow-y: auto;
  background: rgba(0, 0, 0, .52);
  opacity: 0;
  transition: opacity .18s ease;
}

.dialog-backdrop.is-open {
  opacity: 1;
}

.better-world-dialog {
  width: min(540px, 100%);
  max-height: calc(100vh - 48px);
  overflow: auto;
  background: #ffffff;
  border-radius: 4px;
  box-shadow: 0 18px 54px rgba(0, 0, 0, .30);
  transform: translateY(10px) scale(.985);
  transition: transform .18s ease;
}

.dialog-backdrop.is-open .better-world-dialog {
  transform: translateY(0) scale(1);
}

.dialog-header {
  position: sticky;
  z-index: 2;
  top: 0;
  display: flex;
  min-height: 62px;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 20px 0 24px;
  background: #ffffff;
  border-bottom: 1px solid var(--line);
}

.dialog-header h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  line-height: 26px;
}

.icon-button {
  display: inline-grid;
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  place-items: center;
  padding: 0;
  color: #333333;
  background: transparent;
  border: 0;
  border-radius: 3px;
  cursor: pointer;
}

.icon-button:hover {
  background: #f1f1f1;
}

.dialog-close span,
.dialog-close span::after {
  display: block;
  width: 19px;
  height: 2px;
  background: currentColor;
  content: "";
}

.dialog-close span {
  transform: rotate(45deg);
}

.dialog-close span::after {
  transform: rotate(90deg);
}

.better-world-panel {
  margin: 20px;
  padding: 22px 22px 24px;
  background: var(--better-mint);
  border-left: 5px solid var(--better-green);
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--better-green);
}

.brand-lockup strong {
  font-size: 23px;
  font-weight: 900;
  line-height: 28px;
}

.panel-intro {
  margin: 19px 0 8px;
  color: #303030;
  font-size: 15px;
  line-height: 24px;
}

.learn-more,
.document-links button {
  color: var(--link);
  text-align: left;
  text-decoration: underline;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.learn-more {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  font-size: 14px;
  font-weight: 700;
  line-height: 22px;
}

.learn-more:hover,
.document-links button:hover {
  color: #113d82;
}

.arrow-icon {
  position: relative;
  display: inline-block;
  width: 18px;
  height: 12px;
}

.arrow-icon::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  width: 16px;
  height: 1px;
  background: currentColor;
}

.arrow-icon::after {
  content: "";
  position: absolute;
  right: 0;
  top: 2px;
  width: 6px;
  height: 6px;
  border-top: 1px solid currentColor;
  border-right: 1px solid currentColor;
  transform: rotate(45deg);
}

.standard-accordion {
  margin-top: 16px;
  background: rgba(255, 255, 255, .52);
}

.standard-accordion[hidden] {
  display: none;
}

.standard-summary {
  display: flex;
  width: 100%;
  min-height: 86px;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 15px 17px;
  color: #333333;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid #78bd80;
  cursor: pointer;
}

.standard-summary > span:first-child {
  display: grid;
  gap: 3px;
}

.standard-summary strong {
  color: var(--better-green-dark);
  font-size: 15px;
  line-height: 21px;
}

.standard-summary span span {
  font-size: 14px;
  line-height: 21px;
}

.chevron {
  width: 10px;
  height: 10px;
  flex: 0 0 10px;
  border-top: 2px solid #2362b7;
  border-left: 2px solid #2362b7;
  transform: translateY(3px) rotate(45deg);
  transition: transform .18s ease;
}

.standard-summary[aria-expanded="false"] .chevron {
  transform: translateY(-3px) rotate(225deg);
}

.standard-details {
  padding: 1px 17px 16px;
}

.standard-details[hidden] {
  display: none;
}

.standard-details section {
  padding-top: 14px;
}

.standard-details h2 {
  margin: 0 0 3px;
  color: #343434;
  font-size: 14px;
  font-weight: 700;
  line-height: 21px;
}

.standard-details p {
  margin: 0;
  color: #444444;
  font-size: 13px;
  line-height: 21px;
}

.document-links {
  display: grid;
  gap: 3px;
  margin-top: 14px;
}

.document-links[hidden] {
  display: none;
}

.document-links button {
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  align-items: flex-start;
  gap: 6px;
  padding: 0;
  font-size: 13px;
  font-weight: 700;
  line-height: 20px;
}

.document-icon {
  position: relative;
  width: 12px;
  height: 15px;
  flex: 0 0 12px;
  margin-top: 2px;
  border: 1px solid currentColor;
}

.document-icon::after {
  content: "";
  position: absolute;
  left: 2px;
  right: 2px;
  top: 5px;
  height: 3px;
  border-top: 1px solid currentColor;
  border-bottom: 1px solid currentColor;
}

.prototype-toast {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: 28px;
  padding: 10px 14px;
  color: #ffffff;
  background: #252525;
  border-radius: 3px;
  box-shadow: 0 5px 16px rgba(0, 0, 0, .22);
  font-size: 13px;
  line-height: 20px;
  transform: translateX(-50%);
}

html[data-layout="aligned"] .dialog-backdrop {
  background: rgba(25, 25, 25, .56);
}

html[data-layout="aligned"] .better-world-dialog {
  display: flex;
  width: min(620px, 100%);
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #d5d5d5;
  border-radius: 6px;
  box-shadow: 0 18px 52px rgba(0, 0, 0, .28);
}

html[data-layout="aligned"] .dialog-header {
  position: static;
  min-height: 56px;
  padding: 0 16px 0 20px;
  color: #ffffff;
  background: var(--rs-red);
  border-bottom: 0;
}

html[data-layout="aligned"] .dialog-header h1 {
  font-size: 18px;
  line-height: 25px;
}

html[data-layout="aligned"] .dialog-header .icon-button {
  color: #ffffff;
}

html[data-layout="aligned"] .dialog-header .icon-button:hover {
  background: rgba(255, 255, 255, .14);
}

.aligned-dialog-body {
  min-height: 0;
  overflow-y: auto;
  padding: 0 20px 20px;
  background: #ffffff;
}

.dialog-product-summary {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid #e1e1e1;
}

.dialog-product-thumb {
  width: 76px;
  height: 76px;
  background-color: #ffffff;
  background-image: var(--product-image);
  background-repeat: no-repeat;
  background-position: 21.2% 46.4%;
  background-size: 567% auto;
  border: 1px solid #dddddd;
  border-radius: 3px;
}

.dialog-product-summary h2 {
  margin: 0 0 7px;
  color: #292929;
  font-size: 15px;
  font-weight: 700;
  line-height: 22px;
}

.dialog-product-summary p {
  margin: 0;
  color: #6b6b6b;
  font-size: 13px;
  line-height: 20px;
}

.better-world-overview {
  padding: 18px 0 17px;
  border-bottom: 1px solid #e1e1e1;
}

html[data-layout="aligned"] .brand-lockup {
  gap: 9px;
}

html[data-layout="aligned"] .brand-lockup .rs-mark {
  width: 34px;
  height: 34px;
  font-size: 17px;
}

html[data-layout="aligned"] .brand-lockup strong {
  font-size: 21px;
  line-height: 26px;
}

html[data-layout="aligned"] .panel-intro {
  margin: 12px 0 7px;
  color: #3d3d3d;
  font-size: 14px;
  line-height: 22px;
}

html[data-layout="aligned"] .learn-more {
  font-size: 13px;
  line-height: 21px;
}

html[data-layout="aligned"] .standard-accordion {
  margin-top: 18px;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid #ced9d0;
  border-radius: 4px;
}

html[data-layout="aligned"] .standard-summary {
  min-height: 74px;
  padding: 13px 16px;
  background: #f2faf3;
  border-bottom-color: #a7c9ad;
}

html[data-layout="aligned"] .standard-summary:hover {
  background: #eaf6ec;
}

html[data-layout="aligned"] .standard-summary[aria-expanded="false"] {
  border-bottom: 0;
}

html[data-layout="aligned"] .standard-summary strong {
  font-size: 14px;
}

html[data-layout="aligned"] .standard-summary span span {
  color: #4a4a4a;
  font-size: 13px;
}

html[data-layout="aligned"] .standard-details {
  padding: 1px 16px 15px;
  background: #fbfdfb;
}

html[data-layout="aligned"] .standard-details section {
  padding-top: 13px;
}

html[data-layout="aligned"] .standard-details section + section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #e3e8e4;
}

html[data-layout="aligned"] .standard-details h2 {
  color: #2d4f33;
}

html[data-layout="aligned"] .document-links {
  gap: 5px;
  margin-top: 15px;
  padding-top: 13px;
  border-top: 1px solid #e3e8e4;
}

.dialog-footer {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  min-height: 70px;
  padding: 14px 20px;
  background: #ffffff;
  border-top: 1px solid #dddddd;
}

.dialog-action {
  min-width: 82px;
  min-height: 38px;
  padding: 0 17px;
  color: #ffffff;
  border: 1px solid transparent;
  border-radius: 4px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease;
}

.dialog-action--secondary {
  background: #737d84;
  border-color: #737d84;
}

.dialog-action--secondary:hover {
  background: #5f686e;
  border-color: #5f686e;
}

.dialog-action--primary {
  background: var(--rs-red);
  border-color: var(--rs-red);
}

.dialog-action--primary:hover {
  background: var(--rs-red-dark);
  border-color: var(--rs-red-dark);
}

@media (max-width: 799px) {
  body {
    background: #f4f4f4;
  }

  .desktop-reference {
    display: none;
  }

  .mobile-reference {
    display: block;
    width: min(100%, 520px);
    min-height: 100vh;
    margin: 0 auto;
    background: #f4f4f4;
  }

  .mobile-header {
    display: grid;
    min-height: 54px;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    padding: 0 12px;
    color: #ffffff;
    background: var(--rs-red);
  }

  .mobile-logo {
    justify-self: center;
  }

  .mobile-logo .rs-mark {
    width: 34px;
    height: 34px;
    font-size: 17px;
  }

  .mobile-back {
    width: 11px;
    height: 11px;
    border-left: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
  }

  .mobile-cart {
    position: relative;
    justify-self: end;
    width: 18px;
    height: 13px;
    border: 2px solid currentColor;
    border-top: 0;
  }

  .mobile-cart::before,
  .mobile-cart::after {
    content: "";
    position: absolute;
    bottom: -6px;
    width: 3px;
    height: 3px;
    background: currentColor;
    border-radius: 50%;
  }

  .mobile-cart::before {
    left: 2px;
  }

  .mobile-cart::after {
    right: 2px;
  }

  .mobile-title {
    padding: 18px 18px 14px;
    background: #ffffff;
    border-bottom: 1px solid #dedede;
  }

  .mobile-title p {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
    line-height: 25px;
  }

  .mobile-title span {
    color: #777777;
    font-size: 12px;
    line-height: 18px;
  }

  .mobile-product-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / .82;
    background-color: #ffffff;
    background-image: var(--product-image);
    background-repeat: no-repeat;
    background-position: 21.2% 46.4%;
    background-size: 567% auto;
  }

  .mobile-actions {
    display: flex;
    min-height: 66px;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 14px;
    background: #ffffff;
    border-top: 1px solid #e0e0e0;
  }

  .mobile-actions > button:not(.better-world-trigger) {
    min-height: 38px;
    padding: 0 15px;
    color: #444444;
    background: #ffffff;
    border: 1px solid #bcbcbc;
    border-radius: 3px;
  }

  .better-world-trigger--mobile {
    width: 100%;
    height: auto;
    min-height: 74px;
    margin-top: 2px;
    padding: 10px 12px;
  }

  .better-world-trigger--mobile .rs-mark--small {
    width: 25px;
    height: 25px;
    font-size: 12px;
  }

  .better-world-trigger--mobile .trigger-title strong {
    font-size: 14px;
  }

  .better-world-trigger--mobile .trigger-copy {
    font-size: 11px;
    line-height: 17px;
  }

  html[data-layout="aligned"] .better-world-trigger--mobile {
    width: calc(100% + 28px);
    margin-right: -14px;
    margin-left: -14px;
    border-radius: 0;
  }

  .mobile-price {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 16px 14px;
    background: #ffffff;
  }

  .mobile-price span {
    color: #666666;
    font-size: 12px;
  }

  .mobile-price strong {
    color: #222222;
    font-size: 22px;
  }

  .mobile-price button {
    min-height: 42px;
    padding: 0 17px;
    color: #ffffff;
    background: var(--rs-red);
    border: 1px solid var(--rs-red);
    border-radius: 3px;
    font-weight: 700;
  }

  .dialog-backdrop {
    align-items: end;
    padding: 0;
  }

  .better-world-dialog {
    width: 100%;
    max-height: calc(100vh - 24px);
    border-radius: 6px 6px 0 0;
    transform: translateY(24px);
  }

  .dialog-header {
    min-height: 56px;
    padding-left: 18px;
  }

  .dialog-header h1 {
    font-size: 17px;
  }

  .better-world-panel {
    margin: 14px;
    padding: 18px 15px 19px;
  }

  .brand-lockup strong {
    font-size: 20px;
  }

  .panel-intro {
    font-size: 14px;
    line-height: 22px;
  }

  .standard-summary {
    padding-right: 15px;
    padding-left: 15px;
  }

  .standard-details {
    padding-right: 15px;
    padding-left: 15px;
  }

  html[data-layout="aligned"] .better-world-dialog {
    width: 100%;
    max-height: calc(100vh - 12px);
    border-right: 0;
    border-bottom: 0;
    border-left: 0;
    border-radius: 6px 6px 0 0;
  }

  html[data-layout="aligned"] .dialog-header {
    min-height: 54px;
    padding: 0 12px 0 16px;
  }

  html[data-layout="aligned"] .dialog-header h1 {
    font-size: 17px;
  }

  .aligned-dialog-body {
    padding: 0 16px 16px;
  }

  .dialog-product-summary {
    grid-template-columns: 64px minmax(0, 1fr);
    gap: 11px;
    padding: 14px 0;
  }

  .dialog-product-thumb {
    width: 64px;
    height: 64px;
  }

  .dialog-product-summary h2 {
    display: -webkit-box;
    margin-bottom: 4px;
    overflow: hidden;
    font-size: 14px;
    line-height: 20px;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .better-world-overview {
    padding: 15px 0;
  }

  html[data-layout="aligned"] .brand-lockup strong {
    font-size: 19px;
  }

  html[data-layout="aligned"] .standard-accordion {
    margin-top: 15px;
  }

  html[data-layout="aligned"] .standard-summary {
    min-height: 70px;
  }

  .dialog-footer {
    min-height: 64px;
    padding: 12px 16px;
  }

  .dialog-action {
    min-height: 40px;
  }
}

.mobile-reference.mini-program-reference {
  position: relative;
  width: min(100%, 466px);
  min-height: 0;
  margin: 0 auto;
  overflow: hidden;
  background: #f4f4f4;
}

.mini-program-slice {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.mini-program-slice--top {
  aspect-ratio: 466 / 692;
}

.mini-program-slice--bottom {
  aspect-ratio: 466 / 642;
}

.mini-program-image {

(() => {
  const backdrop = document.getElementById("better-world-backdrop");
  const dialog = document.getElementById("better-world-dialog");
  const openButtons = Array.from(document.querySelectorAll("[data-open-better-world]"));
  const closeButtons = Array.from(dialog.querySelectorAll("[data-close-better-world]"));
  const closeButton = closeButtons[0];
  const accordionButton = dialog.querySelector("[data-toggle-standards]");
  const accordionPanel = document.getElementById("better-world-standards");
  const accordion = dialog.querySelector("[data-standard-accordion]");
  const standardLabels = dialog.querySelector("[data-standard-labels]");
  const lowCarbonDetail = dialog.querySelector("[data-standard-detail='low-carbon']");
  const lifeExtensionDetail = dialog.querySelector("[data-standard-detail='life-extension']");
  const energySavingDetail = dialog.querySelector("[data-standard-detail='energy-saving']");
  const documentLinks = dialog.querySelector("[data-document-links]");
  const learnMoreLabel = dialog.querySelector("[data-learn-more-label]");
  const toast = document.querySelector(".prototype-toast");
  let previouslyFocused = null;
  let toastTimer = null;

  // Product data maps to the five content variants supplied in the design reference.
  const searchParams = new URLSearchParams(window.location.search);
  const requestedVariant = Number(searchParams.get("type"));
  const variant = [1, 2, 3, 4, 5].includes(requestedVariant) ? requestedVariant : 5;
  const usesLowCarbon = variant === 2 || variant === 3;
  const showsDocuments = variant === 3 || variant === 5;

  if (searchParams.get("layout") === "aligned") {
    document.documentElement.dataset.layout = "aligned";
  }

  accordion.hidden = variant === 1;
  learnMoreLabel.textContent = variant === 1
    ? "点击此处了解更多"
    : "了解 RS Better World 产品的更多信息";
  standardLabels.innerHTML = usesLowCarbon ? "低碳制造" : "延长产品寿命<br>节能";
  lowCarbonDetail.hidden = !usesLowCarbon;
  lifeExtensionDetail.hidden = usesLowCarbon;
  energySavingDetail.hidden = usesLowCarbon;
  documentLinks.hidden = !showsDocuments;

  const focusableSelector = [
    "button:not([disabled])",
    "a[href]",
    "input:not([disabled])",
    "select:not([disabled])",
    "textarea:not([disabled])",
    "[tabindex]:not([tabindex='-1'])"
  ].join(",");

  const setTriggerState = (expanded) => {
    openButtons.forEach((button) => button.setAttribute("aria-expanded", String(expanded)));
  };

  const openDialog = (trigger) => {
    previouslyFocused = trigger;
    backdrop.hidden = false;
    document.body.style.overflow = "hidden";
    setTriggerState(true);
    requestAnimationFrame(() => {
      backdrop.classList.add("is-open");
      closeButton.focus();
    });
  };

  const closeDialog = () => {
    backdrop.classList.remove("is-open");
    setTriggerState(false);
    document.body.style.overflow = "";
    window.setTimeout(() => {
      backdrop.hidden = true;
      previouslyFocused?.focus();
    }, 180);
  };

  const trapFocus = (event) => {
    if (event.key !== "Tab") return;
    const focusable = Array.from(dialog.querySelectorAll(focusableSelector));
    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  };

  openButtons.forEach((button) => {
    button.addEventListener("click", () => openDialog(button));
  });

  closeButtons.forEach((button) => button.addEventListener("click", closeDialog));

  backdrop.addEventListener("click", (event) => {
    if (event.target === backdrop) closeDialog();
  });

  document.addEventListener("keydown", (event) => {
    if (backdrop.hidden) return;
    if (event.key === "Escape") closeDialog();
    trapFocus(event);
  });

  accordionButton.addEventListener("click", () => {
    const expanded = accordionButton.getAttribute("aria-expanded") === "true";
    accordionButton.setAttribute("aria-expanded", String(!expanded));
    accordionPanel.hidden = expanded;
  });

  dialog.querySelectorAll("[data-document-action]").forEach((button) => {
    button.addEventListener("click", () => {
      toast.hidden = false;
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => {
        toast.hidden = true;
      }, 1800);
    });
  });
})();

  </script>
