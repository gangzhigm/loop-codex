<!doctype html>
<!--
  Local Agent Loop 主监控页。

  运行链路：dashboard_server.py 提供本文件 -> 浏览器轮询 /api/state ->
  validateState() 校验 Schema 3.7.0 -> applyState() 保留最后一次有效快照 -> render() 渲染。

  本文件是单文件模板，CSS 和 JavaScript 均内嵌。任务事实不在浏览器中维护：筛选、弹窗、
  抽屉等变量都只是临时界面状态；归档和恢复必须调用 /api/task-action，由服务端进入 loopctl
  状态机。Provider 密钥只通过同源 /api/secrets 传给 SecretStore，禁止写入 DOM 持久存储。

  手工排查顺序：先看 /api/state HTTP 响应，再看 validateState() 的页面提示，然后检查
  renderTasks()/renderProfiles() 的投影；写操作失败则检查 Dashboard Server 对应 API 路由，
  不要直接修改本文件伪造成功状态或直接修改 SQLite。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Local Agent Loop</title>
  <style>
    /* 一、全局设计令牌和页面骨架。颜色变量同时服务状态标签和分布条，修改时需复核对比度。 */
    :root {
      --canvas: #f3f5f7;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --ink: #18212b;
      --muted: #66727f;
      --line: #dce2e8;
      --line-strong: #c8d0d8;
      --accent: #087f8c;
      --accent-soft: #e7f4f5;
      --success: #137a4a;
      --success-soft: #e8f5ee;
      --warning: #9a5b00;
      --warning-soft: #fff3d9;
      --danger: #b42318;
      --danger-soft: #fdecea;
      --human: #7c3b83;
      --human-soft: #f5eaf6;
      --neutral-soft: #edf1f4;
      --shadow: 0 8px 24px rgba(24, 33, 43, 0.12);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body { height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
    }

    button, input { font: inherit; }

    button { letter-spacing: 0; }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(8, 127, 140, 0.25);
      outline-offset: 2px;
    }

    .app-header {
      flex: 0 0 auto;
      min-height: 78px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      grid-template-areas: "brand status actions";
      align-items: center;
      gap: 18px;
      padding: 10px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      grid-area: brand;
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    .header-status {
      grid-area: status;
      min-width: 0;
    }

    .header-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .primary-button,
    .secondary-button {
      min-height: 38px;
      border-radius: 6px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .primary-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .primary-button:hover { background: #066d78; }

    .settings-button {
      display: inline-grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .settings-button:hover,
    .settings-button:focus-visible { background: var(--surface-subtle); }

    .settings-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .operations-link {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .operations-link:hover,
    .operations-link:focus-visible { background: var(--surface-subtle); }

    .operations-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .secondary-button {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
    }

    .secondary-button:hover { background: var(--surface-subtle); }

    .main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 16px 28px;
    }

    /* 二、全局错误提示。状态校验或网络失败时显示，成功刷新后由 hideNotice() 清除。 */
    .notice {
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 11px 14px;
      border: 1px solid #e7c985;
      border-radius: 6px;
      background: var(--warning-soft);
      color: #654100;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice.is-visible { display: flex; }

    .notice button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-weight: 800;
    }

    /* 三、顶部任务状态总览。每个 metric 既显示数量，也作为一级任务分类筛选按钮。 */
    .summary-band {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: visible;
    }

    .metric {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      min-height: 42px;
      padding: 7px 10px;
      border-right: 1px solid var(--line);
    }

    .metric:last-child { border-right: 0; }

    .metric-filter {
      position: relative;
      width: 100%;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .metric-filter:hover,
    .metric-filter:focus-visible,
    .metric-filter[aria-pressed="true"] {
      background: var(--accent-soft);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .metric-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .metric-help {
      display: inline-grid;
      width: 13px;
      height: 13px;
      margin-left: 4px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      color: var(--ink);
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      cursor: help;
      vertical-align: 1px;
    }

    .metric-tooltip {
      position: absolute;
      z-index: 30;
      top: calc(100% + 7px);
      left: 8px;
      width: max-content;
      max-width: min(320px, calc(100vw - 32px));
      padding: 7px 9px;
      border: 1px solid #354352;
      border-radius: 4px;
      background: #1c2733;
      box-shadow: 0 8px 20px rgba(24, 33, 43, 0.18);
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.5;
      white-space: normal;
      text-align: left;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-2px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms ease;
    }

    .metric:nth-child(n + 4) .metric-tooltip {
      right: 8px;
      left: auto;
    }

    .metric-help:hover + .metric-tooltip,
    .metric-filter:focus-visible .metric-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .metric-value {
      display: block;
      margin-top: 4px;
      font-size: 19px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
    }

    .metric-value.success { color: var(--success); }
    .metric-value.warning { color: var(--warning); }
    .metric-value.danger { color: var(--danger); }

    .distribution {
      margin-top: 6px;
      height: 6px;
      display: flex;
      overflow: hidden;
      border-radius: 3px;
      background: var(--neutral-soft);
    }

    .distribution span { min-width: 0; transition: width 180ms ease; }
    .distribution .done { background: var(--success); }
    .distribution .active { background: var(--accent); }
    .distribution .attention { background: var(--warning); }
    .distribution .failed { background: var(--danger); }
    .distribution .queued { background: #98a2ad; }

    /* 四、运行链路只消费 Supervisor 快照，不提供任何组件控制入口。 */
    .runtime-section {
      flex: 0 0 auto;
      margin-bottom: 16px;
    }

    .runtime-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .runtime-heading-row h2 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .runtime-updated {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .runtime-flow {
      display: grid;
      justify-items: center;
      min-width: 0;
    }

    .runtime-root {
      width: min(360px, 100%);
    }

    .runtime-stem {
      width: 1px;
      height: 18px;
      background: var(--line-strong);
    }

    .runtime-targets {
      position: relative;
      display: grid;
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding-top: 18px;
    }

    .runtime-targets::before {
      position: absolute;
      top: 0;
      right: 25%;
      left: 25%;
      height: 1px;
      background: var(--line-strong);
      content: "";
    }

    .runtime-target {
      position: relative;
      min-width: 0;
    }

    .runtime-target::before {
      position: absolute;
      top: -18px;
      left: 50%;
      width: 1px;
      height: 18px;
      background: var(--line-strong);
      content: "";
    }

    .runtime-node {
      display: grid;
      align-content: start;
      gap: 7px;
      min-width: 0;
      min-height: 92px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
    }

    .runtime-node[data-tone="healthy"] { border-left-color: var(--success); }
    .runtime-node[data-tone="active"] { border-left-color: var(--accent); }
    .runtime-node[data-tone="warning"] { border-left-color: var(--warning); }
    .runtime-node[data-tone="danger"] { border-left-color: var(--danger); }

    .runtime-node-header,
    .runtime-node-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .runtime-node-name {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .runtime-state {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .runtime-state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line-strong);
    }

    .runtime-state[data-tone="healthy"] { color: var(--success); }
    .runtime-state[data-tone="healthy"] .runtime-state-dot { background: var(--success); }
    .runtime-state[data-tone="active"] { color: var(--accent); }
    .runtime-state[data-tone="active"] .runtime-state-dot { background: var(--accent); }
    .runtime-state[data-tone="warning"] { color: var(--warning); }
    .runtime-state[data-tone="warning"] .runtime-state-dot { background: var(--warning); }
    .runtime-state[data-tone="danger"] { color: var(--danger); }
    .runtime-state[data-tone="danger"] .runtime-state-dot { background: var(--danger); }

    .runtime-node-meta {
      justify-content: flex-start;
      flex-wrap: wrap;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 10px;
    }

    .runtime-node-message {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    /* 五、主工作区：左侧任务表，右侧只显示调度容量；窄屏下改为单列。 */
    .content-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.26fr);
      gap: 16px;
      align-items: stretch;
    }

    .task-section,
    .side-section {
      min-width: 0;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .section-header {
      min-height: 58px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .section-header h2,
    .side-block .side-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .view-count,
    .archive-time {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0;
    }

    .task-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 10px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .search-input {
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--ink);
      background: var(--surface);
    }

    .search-input {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      max-width: 360px;
    }

    .search-input,
    .header-filter-button,
    .header-filter-option {
      font-family: inherit;
      font-size: 12px;
      font-weight: 650;
      line-height: normal;
    }

    .task-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 六、任务表与表头筛选。header-filter-menu 使用 fixed 定位，由 JS 跟随按钮和滚动重排。 */
    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 38px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface-subtle);
      font-size: 11px;
      font-weight: 700;
      text-align: left;
    }

    .table-header-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
    }

    .header-filter-button {
      display: inline-grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .header-filter-button::before {
      width: 12px;
      height: 10px;
      background: currentColor;
      clip-path: polygon(0 0, 100% 0, 64% 45%, 64% 100%, 36% 100%, 36% 45%);
      content: "";
    }

    .header-filter-button:hover,
    .header-filter-button:focus-visible,
    .header-filter-button.is-active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .header-filter-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .header-filter-menu {
      position: fixed;
      z-index: 20;
      display: grid;
      gap: 3px;
      width: max-content;
      min-width: 166px;
      max-width: min(280px, calc(100vw - 24px));
      max-height: min(320px, calc(100vh - 24px));
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 5px;
      background: var(--surface);
      box-shadow: 0 8px 20px rgba(24, 33, 43, 0.18);
    }

    .header-filter-option {
      width: 100%;
      min-height: 30px;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }

    .header-filter-option:hover,
    .header-filter-option:focus-visible,
    .header-filter-option[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); }
    .header-filter-option:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      font-size: 13px;
    }

    .task-time-info {
      display: grid;
      gap: 4px;
      min-width: 0;
      font-size: 11px;
      line-height: 1.25;
    }

    .task-time-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: baseline;
      gap: 5px;
      min-width: 0;
    }

    .task-time-label { color: var(--muted); font-size: 10px; }
    .task-time-value { min-width: 0; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .task-time-value.is-placeholder { color: var(--muted); font-weight: 500; }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f7fbfb; }
    tbody tr:last-child td { border-bottom: 0; }

    .task-cell { min-width: 0; }

    .task-title-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .task-title {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-copy-button {
      position: relative;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .task-copy-button:hover { color: var(--accent); background: var(--accent-soft); }
    .task-copy-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .task-copy-button:active { color: #075f68; background: #cceff0; transform: translateY(1px); }
    .task-copy-button[data-copy-state="success"] { color: var(--success); background: var(--success-soft); }
    .task-copy-button[data-copy-state="failed"] { color: var(--danger); background: var(--danger-soft); }
    .copy-icon { font-size: 17px; line-height: 1; }

    .task-action-heading,
    .task-action-cell {
      padding-inline: 8px 24px;
      text-align: center;
    }

    .archive-button,
    .recovery-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 0 7px;
      color: var(--accent);
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .archive-button { width: 62px; height: 32px; }
    .recovery-button { width: 78px; height: 32px; }

    .archive-button:hover,
    .recovery-button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .archive-button:focus-visible,
    .recovery-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .archive-button:disabled,
    .recovery-button:disabled { cursor: wait; opacity: 0.58; }
    .archive-button.is-submitting .archive-icon { animation: archive-submit 0.8s linear infinite; }
    .recovery-button { color: #8a4b08; }
    .recovery-state { color: #8a4b08; font-size: 11px; font-weight: 700; }
    .recovery-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .archive-icon { font-size: 15px; line-height: 1; }
    @keyframes archive-submit { to { transform: rotate(360deg); } }
    .copy-feedback {
      position: absolute;
      z-index: 2;
      top: -29px;
      left: 50%;
      min-width: max-content;
      transform: translateX(-50%);
      border-radius: 4px;
      padding: 3px 6px;
      color: #fff;
      background: #26333d;
      box-shadow: 0 2px 6px rgba(24, 33, 43, 0.18);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      opacity: 0;

    .task-id {

    .status-badge,

    .status-draft, .status-pending, .status-claimed { background: var(--neutral-soft); color: #46515c; }

    .conflict-summary:focus-within .conflict-popover,
    .queue-summary[open] .conflict-popover,
    .queue-summary:hover .conflict-popover,
    .queue-summary:focus-within .conflict-popover { display: grid; gap: 10px; }

    .conflict-group {
      display: grid;
      min-width: 0;
      gap: 4px;
    }

    .conflict-group + .conflict-group {

    }

    .conflict-task-title { color: var(--ink); font-size: 12px; line-height: 1.4; }

    .conflict-task-id,
    .conflict-scope {

      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 10px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conflict-scopes {
      display: grid;
      gap: 4px;
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }

    .conflict-scopes li { display: grid; min-width: 0; gap: 1px; }
    .conflict-detected { color: var(--muted); font-size: 10px; line-height: 1.4; }

    .conflict-detail-list {
      display: grid;
      gap: 12px;
    }

    .priority-critical { background: var(--danger-soft); color: var(--danger); }
    .priority-blocker { background: #7f1d1d; color: #fff; }
    .priority-high { background: var(--warning-soft); color: var(--warning); }
    .priority-medium { background: var(--accent-soft); color: #056a74; }
    .priority-low { background: var(--neutral-soft); color: var(--muted); }

    .profile-badge,
    .environment-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 7px;
      background: var(--surface-subtle);
      color: #3f4c58;
      font-size: 10px;
      font-weight: 730;
      line-height: 1.2;
      white-space: nowrap;
    }
    .profile-L1 { border-color: #cad8ce; background: #eff6f1; color: #315d3d; }
    .profile-L2 { border-color: #c9d9dc; background: #f2f8f8; color: #315c62; }
    .profile-L3 { border-color: #d7cfaa; background: #f8f5e8; color: #66591b; }
    .profile-L4 { border-color: #d2c4da; background: #f5eff7; color: #654773; }
    .profile-L5 { border-color: #ddc4c4; background: #faeeee; color: #7c3030; }
    .environment-badge { border-color: #c7d0d9; background: #f3f5f7; color: #364553; }

    .project-cell {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      min-width: 0;
      gap: 4px;
    }

    .project-badge {
      display: inline-block;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid #c9d9dc;
      border-radius: 4px;
      padding: 3px 6px;
      background: #f2f8f8;
      color: #315c62;
      font-family: Consolas, monospace;
      font-size: 10px;
      line-height: 1.3;

    .muted { color: var(--muted); }

    .empty-state {

    /* 七、能力等级容量。这里只展示服务端投影，不在前端修改真实并发配置。 */

    }

    .side-block + .side-block { border-top: 1px solid var(--line); }

    .side-heading {

      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      border: 0;
      padding: 14px 16px;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
    }

    .side-heading-group {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 8px;
    }

    .side-heading-summary {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;

    .side-heading::after {

    .side-heading::after {

      height: 8px;
      margin-left: 4px;

    .side-content {

      padding: 0 16px 16px;

    }

    .profile-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;

    .profile-row {

      text-align: left;

    }

    .profile-row.profile-level-L1 { border-left-color: #68a873; background: #edf6ef; }
    .profile-row.profile-level-L2 { border-left-color: #9cba55; background: #f1f6e8; }
    .profile-row.profile-level-L3 { border-left-color: #d0aa35; background: #faf5df; }
    .profile-row.profile-level-L4 { border-left-color: #d98239; background: #fcf0e5; }
    .profile-row.profile-level-L5 { border-left-color: #b94b4b; background: #f9e9e8; }

    .profile-row:hover {
      border-color: #7a8792;

    .profile-row:active {

    .profile-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .profile-level-label {
      color: #24313b;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.15;
    }

    .profile-capacity {
      color: var(--muted);

      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .agent-dot {

      height: 9px;
      border-radius: 50%;

    }

    .agent-dot.running { background: var(--accent); }
    .agent-dot.idle { background: var(--success); }

    .agent-name {

    }

    .agent-role { color: var(--muted); font-size: 11px; }

    /* 七、任务详情弹窗。任务字段来自最后一次通过 validateState() 的完整快照。 */
    .detail-dialog {
      width: min(680px, calc(100vw - 32px));
      max-height: min(780px, calc(100vh - 32px));
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
      color: var(--ink);
    }

    .detail-dialog::backdrop { background: rgba(24, 33, 43, 0.48); }

    .settings-scrim {
      position: fixed;
      z-index: 30;
      inset: 0;
      border: 0;
      background: rgba(24, 33, 43, 0.48);
      cursor: default;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    /* 八、Provider 密钥抽屉。输入仅存于当前 DOM，关闭抽屉时由 clearSecretCandidateInputs() 清空。 */
    .settings-drawer {
      position: fixed;
      z-index: 31;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      width: min(440px, 100%);
      height: 100dvh;
      border-left: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateX(100%);
      transition: transform 180ms ease;
      visibility: hidden;
    }

    .settings-drawer.is-open { transform: translateX(0); visibility: visible; }
    .settings-scrim.is-visible { opacity: 1; pointer-events: auto; }

    .settings-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .settings-drawer-header h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
    .settings-drawer-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .secret-drawer-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);

    .secret-drawer-summary strong { font-size: 13px; }

    .local-only-label {

      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid #b7d8dc;
      border-radius: 4px;
      background: var(--accent-soft);
      color: #05616b;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .secret-api-notice {
      min-height: 20px;
      padding: 10px 18px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .secret-api-notice.is-error { color: var(--danger); }
    .secret-api-notice.is-success { color: var(--success); }

    .secret-provider-list { display: grid; }

    .secret-provider {
      min-width: 0;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .secret-provider-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .secret-provider-name {
      margin: 0;
      font-size: 14px;
      line-height: 1.35;
    }

    .secret-provider-id {
      margin-top: 2px;
      color: var(--muted);
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 11px;
    }

    .secret-status {
      flex: 0 0 auto;
      min-height: 26px;
      padding: 4px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--neutral-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .secret-status[data-state="valid"] {
      border-color: #a7d2bc;
      background: var(--success-soft);
      color: var(--success);
    }

    .secret-status[data-state="invalid"],
    .secret-status[data-state="storage_unavailable"] {
      border-color: #efb6b1;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .secret-status[data-state="configured_unverified"] {
      border-color: #e7c985;
      background: var(--warning-soft);
      color: var(--warning);

    .secret-meta {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);

      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.45;
    }

    .secret-meta dt { color: var(--muted); }
    .secret-meta dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }

    .secret-repair {
      margin: 12px 0 0;
      padding: 9px 10px;
      border-left: 3px solid var(--danger);
      background: var(--danger-soft);
      color: #7a1c15;

      line-height: 1.5;
    }

    .secret-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .secret-action-button {
      min-width: 76px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .secret-action-button:hover { background: var(--surface-subtle); }
    .secret-action-button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .secret-action-button.primary:hover { background: #066d78; }
    .secret-action-button.danger { border-color: #efb6b1; color: var(--danger); }
    .secret-action-button:disabled { cursor: wait; opacity: 0.58; }

    .secret-form {
      display: grid;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .secret-field-label { font-size: 12px; font-weight: 750; }

    .secret-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 62px;
      gap: 8px;
    }

    .secret-input {
      width: 100%;
      min-width: 0;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 7px 10px;

      color: var(--ink);

    .secret-toggle {

      font-weight: 700;

    .secret-connect-option {

      line-height: 1.45;
    }

    .secret-form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .secret-empty {

      text-align: center;
    }

    .dialog-header {

      align-items: flex-start;

      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);

    .dialog-header h2 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .dialog-header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

    .icon-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);

      font-size: 22px;

    .dialog-body { padding: 20px; }

    .detail-grid {

      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-field {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-subtle);
    }

    .detail-label { display: block; color: var(--muted); font-size: 10px; }
    .detail-value { display: block; margin-top: 5px; overflow-wrap: anywhere; font-size: 12px; font-weight: 700; }

    .detail-block + .detail-block { margin-top: 20px; }
    .detail-block h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0; }
    .detail-block p { margin: 0; color: #44505c; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .detail-block ul { margin: 0; padding-left: 18px; color: #44505c; font-size: 12px; line-height: 1.7; }
    .planner-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 0; }
    .planner-meta > div { min-width: 0; }
    .planner-meta dt { color: var(--muted); font-size: 11px; }
    .planner-meta dd { margin: 3px 0 0; overflow-wrap: anywhere; font-size: 12px; font-weight: 700; }
    .scope-list { display: grid; gap: 4px; padding: 0; list-style: none; }

    .split-suggestion { border-left: 3px solid var(--warning); padding-left: 10px; }
    .split-suggestion + .split-suggestion { margin-top: 12px; }
    .split-task { margin-top: 8px; }
    .split-task strong, .split-task span { display: block; }

    .attachment-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;

      padding: 0 !important;
      list-style: none;

    .attachment-item {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-subtle);
    }

    .attachment-link {
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 10;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: var(--surface);

    .attachment-image {
      display: block;
      width: 100%;
      height: 100%;

    .attachment-meta {
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      line-height: 1.4;
    }

    .attachment-role { color: var(--ink); font-size: 11px; font-weight: 700; }

    .timeline { margin: 0; padding: 0; list-style: none; }

    .timeline li::after { content: ""; position: absolute; top: 13px; bottom: 0; left: 5px; width: 1px; background: var(--line-strong); }
    .timeline li:last-child::after { display: none; }
    .timeline time { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

    /* 九、响应式边界：1180 调整页头，1080 转单列，760 把表格转卡片行，420 收紧操作区。 */
    @media (max-width: 1180px) {
      .app-header {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "brand actions"
          "status status";
      }
    }

    @media (max-width: 1080px) {
      body {
        min-height: 100vh;
        overflow: auto;
        display: block;
      }
      .main { display: block; }
      .summary-band { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric:nth-child(3) { border-right: 0; }
      .metric:nth-child(-n + 3) { border-bottom: 1px solid var(--line); }
      .metric .metric-tooltip { right: auto; left: 8px; }
      .metric:nth-child(3n) .metric-tooltip { right: 8px; left: auto; }
      .content-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
      .task-section { display: block; overflow: hidden; }
      .table-wrap { min-height: auto; overflow-x: auto; overflow-y: visible; }
      .empty-state { min-height: 280px; }
      .side-section { display: block; overflow: visible; }
      .side-block + .side-block { border-top: 1px solid var(--line); border-left: 0; }
    }

    @media (max-width: 760px) {
      body { overflow-x: hidden; }
      .app-header {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "brand"
          "status"
          "actions";
        align-items: stretch;
        padding: 14px 16px;
      }
      .header-actions { width: 100%; justify-content: space-between; }
      .main { padding: 16px 12px 28px; }
      .runtime-heading-row { align-items: flex-start; flex-direction: column; gap: 3px; }
      .runtime-targets { grid-template-columns: minmax(0, 1fr); gap: 12px; padding-top: 14px; }
      .runtime-targets::before { display: none; }
      .runtime-target::before { top: -14px; display: block; height: 14px; }
      .summary-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { min-height: 44px; border-bottom: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:nth-last-child(-n + 2) { border-bottom: 0; }
      .metric:nth-child(3) { border-right: 1px solid var(--line); }
      .metric .metric-tooltip { right: auto; left: 8px; }
      .metric:nth-child(2n) .metric-tooltip { right: 8px; left: auto; }
      .section-header { grid-template-columns: minmax(0, 1fr); align-items: stretch; padding: 12px; }
      .task-section { overflow: hidden; }
      .task-tools { justify-content: flex-start; padding-bottom: 4px; }
      .search-input { flex: 1 1 auto; width: 100%; max-width: none; }
      .table-wrap { width: 100%; overflow: visible; }
      table, thead, tbody { display: block; width: 100%; min-width: 0; }
      table { table-layout: auto; }
      thead { display: none; }
      tbody tr { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; padding: 13px; border-bottom: 1px solid var(--line); }
      tbody tr:last-child { border-bottom: 0; }
      td { display: grid; align-content: start; justify-items: start; gap: 4px; width: auto; max-width: 100%; min-width: 0; min-height: 42px; overflow: hidden; padding: 0; border: 0; }
      td::before { content: attr(data-label); color: var(--muted); font-size: 10px; line-height: 1.2; }
      td:first-child { grid-column: 1 / -1; display: block; min-height: 0; padding-bottom: 5px; }
      td:first-child::before { display: none; }
      td > * { min-width: 0; max-width: 100%; }
      .task-title { white-space: normal; }
      .task-title-line { width: 100%; align-items: start; }
      .status-cell { overflow: visible; }
      .status-stack { width: 100%; justify-items: start; }
      .conflict-summary, .queue-summary { width: min(240px, 100%); }
      .task-time-info { width: 100%; }
      .task-time-row { grid-template-columns: 30px minmax(0, 1fr); }
      .conflict-popover { right: auto; left: 0; }
      .project-cell { width: 100%; align-items: flex-start; }
      td.task-action-cell {
        align-content: center;
        justify-items: start;
        padding: 0 12px 0 0;
      }
      td.task-action-cell:empty { min-height: 0; }
      td.task-action-cell:empty::before { display: none; }
      .side-section { grid-template-columns: minmax(0, 1fr); }
      .side-block + .side-block { border-top: 1px solid var(--line); border-left: 0; }
      .profile-row { min-height: 44px; padding-block: 10px; }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .planner-meta { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 420px) {
      .header-actions { align-items: stretch; flex-direction: column; }
      .primary-button { width: 100%; }
      .detail-grid { grid-template-columns: minmax(0, 1fr); }
      .profile-heading-row { align-items: flex-start; flex-direction: column; gap: 3px; }
    }
  </style>
</head>
<body>
  <!-- 顶部六项统计是一级筛选入口；数量由 render() 从未归档任务和 archived_at 重新计算。 -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">LA</div>
    </div>
    <div class="header-status">
      <section class="summary-band" aria-label="任务总览">
        <button class="metric metric-filter" type="button" data-filter="draft" aria-pressed="false" aria-describedby="metricDraftHelp"><span class="metric-label">草稿<span class="metric-help" aria-hidden="true">!</span><span id="metricDraftHelp" class="metric-tooltip" role="tooltip">包含：DRAFT（草稿）</span></span><span id="metricDraft" class="metric-value">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="review" aria-pressed="false" aria-describedby="metricReviewHelp"><span class="metric-label">需确认<span class="metric-help" aria-hidden="true">!</span><span id="metricReviewHelp" class="metric-tooltip" role="tooltip">包含：NEEDS_REVIEW（需确认）、WAITING_HUMAN（等待人工）、STALLED（已卡顿）</span></span><span id="metricReview" class="metric-value warning">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="pending" aria-pressed="false" aria-describedby="metricPendingHelp"><span class="metric-label">待执行<span class="metric-help" aria-hidden="true">!</span><span id="metricPendingHelp" class="metric-tooltip" role="tooltip">包含：PENDING（待执行）、WAITING_CONFLICT（等待冲突）、BLOCKED（已阻塞）</span></span><span id="metricPending" class="metric-value">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="active" aria-pressed="false" aria-describedby="metricRunningHelp"><span class="metric-label">执行中<span class="metric-help" aria-hidden="true">!</span><span id="metricRunningHelp" class="metric-tooltip" role="tooltip">包含：CLAIMED（已领取）、RUNNING（执行中）</span></span><span id="metricRunning" class="metric-value">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="closed" aria-pressed="false" aria-describedby="metricClosedHelp"><span class="metric-label">已结束<span class="metric-help" aria-hidden="true">!</span><span id="metricClosedHelp" class="metric-tooltip" role="tooltip">包含未归档的：SUCCEEDED（已完成）、CONFIRMED（已确认）、FAILED（失败）、CANCELLED（已取消）</span></span><span id="metricConfirmation" class="metric-value success">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="archived" aria-pressed="false" aria-describedby="metricArchivedHelp"><span class="metric-label">已归档<span class="metric-help" aria-hidden="true">!</span><span id="metricArchivedHelp" class="metric-tooltip" role="tooltip">包含 archived_at 已设置的终态任务，任务原状态保持不变</span></span><span id="metricArchived" class="metric-value success">0</span></button>
      </section>
      <div id="distribution" class="distribution" aria-label="任务状态分布">
        <span class="done" style="width: 0"></span>
        <span class="active" style="width: 0"></span>
        <span class="attention" style="width: 0"></span>
        <span class="failed" style="width: 0"></span>
        <span class="queued" style="width: 100%"></span>
      </div>
    </div>
    <div class="header-actions">
      <a class="operations-link" href="/operations.html">运维配置</a>
      <button id="openSettings" class="settings-button" type="button" aria-label="设置" aria-expanded="false" aria-controls="settingsDrawer" title="设置">&#9881;</button>
    </div>
  </header>

  <main class="main">
    <!-- 网络、Schema 或写操作错误统一进入 notice，避免散落的错误提示覆盖任务表。 -->
    <div id="notice" class="notice" role="alert">
      <span id="noticeText"></span>
      <button id="dismissNotice" type="button" aria-label="关闭提示" title="关闭">×</button>
    </div>

    <!-- 运行链路只展示 /api/state 中已有的健康快照，不提供启动、停止或恢复操作。 -->
    <section class="runtime-section" aria-labelledby="runtimeHeading">
      <div class="runtime-heading-row">
        <h2 id="runtimeHeading">运行链路</h2>
        <span id="runtimeUpdated" class="runtime-updated">尚无快照</span>
      </div>
      <div class="runtime-flow" aria-live="polite">
        <div id="runtimeSupervisor" class="runtime-root"></div>
        <div class="runtime-stem" aria-hidden="true"></div>
        <div class="runtime-targets">
          <div id="runtimePlanner" class="runtime-target"></div>
          <div id="runtimeDispatcher" class="runtime-target"></div>
        </div>
      </div>
    </section>

    <div class="content-grid">
      <!-- 任务列表默认显示待执行；表头筛选项只从当前上下文中确实存在的数据生成。 -->
      <section class="task-section">
        <div class="section-header">
          <div class="section-title"><h2>任务</h2><span id="taskViewCount" class="view-count">当前 0 项</span></div>
          <div class="task-tools">
            <input id="search" class="search-input" type="search" placeholder="搜索 ID、标题或项目" aria-label="搜索任务">
          </div>
        </div>
        <div id="taskTable" class="table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th style="width: 19%">任务</th>
                <th style="width: 11%"><span class="table-header-label">状态 <button id="statusFilter" class="header-filter-button" type="button" aria-label="筛选状态" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选状态"></button></span></th>
                <th style="width: 8%"><span class="table-header-label">优先级 <button id="priorityFilter" class="header-filter-button" type="button" aria-label="筛选优先级" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选优先级"></button></span></th>
                <th style="width: 10%"><span class="table-header-label">能力等级 <button id="profileFilter" class="header-filter-button" type="button" aria-label="筛选能力等级" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选能力等级"></button></span></th>
                <th style="width: 15%"><span class="table-header-label">运行环境 <button id="environmentFilter" class="header-filter-button" type="button" aria-label="筛选运行环境" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选运行环境"></button></span></th>
                <th style="width: 15%"><span class="table-header-label">项目 <button id="projectFilter" class="header-filter-button" type="button" aria-label="筛选项目" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选项目"></button></span></th>
                <th style="width: 15%">时间</th>
                <th class="task-action-heading" style="width: 10%">操作</th>
              </tr>
            </thead>
            <tbody id="taskRows"></tbody>
          </table>
        </div>
        <div id="taskEmpty" class="empty-state">
          <div><strong>正在载入任务</strong><span>等待 SQLite 状态服务响应</span></div>
        </div>
        <div id="headerFilterMenu" class="header-filter-menu" role="menu" hidden></div>
      </section>

      <!-- 容量卡展示活动 execution/上限；按钮交互当前仅保留扩展入口，不直接触发调度。 -->
      <aside class="side-section" aria-label="运行详情">
        <section class="side-block">
          <button class="side-heading" type="button" aria-expanded="true" aria-controls="profileContent"><span class="side-heading-group"><span class="side-title" role="heading" aria-level="2">调度容量</span><span id="profileCount" class="side-heading-summary">0/8</span></span></button>
          <div id="profileContent" class="side-content is-expanded"><ul id="profileList" class="profile-list"><li class="muted">暂无任务</li></ul></div>
        </section>
      </aside>
    </div>
  </main>

  <!-- 任务详情包含 Operator 原始定义、Planner 补充、结果诊断、附件和历史。 -->
  <dialog id="taskDialog" class="detail-dialog">
    <div class="dialog-header">
      <div><h2 id="dialogTitle"></h2><p id="dialogSubtitle"></p></div>
      <button id="closeDialog" class="icon-button" type="button" aria-label="关闭任务详情" title="关闭">×</button>
    </div>
    <div id="dialogBody" class="dialog-body"></div>
  </dialog>

  <!-- Provider 密钥管理是独立安全边界；CSRF token 只保存在内存变量中。 -->
  <button id="settingsScrim" class="settings-scrim" type="button" aria-label="关闭设置" aria-hidden="true" tabindex="-1"></button>
  <aside id="settingsDrawer" class="settings-drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="settingsDrawerTitle">
    <div class="settings-drawer-header">
      <h2 id="settingsDrawerTitle">Provider 密钥</h2>
      <button id="closeSettings" class="icon-button" type="button" aria-label="关闭设置" title="关闭">×</button>
    </div>
    <div class="settings-drawer-body">
      <div class="secret-drawer-summary">
        <strong>SecretStore</strong>
        <span class="local-only-label">仅限本机同源</span>
      </div>
      <div id="secretApiNotice" class="secret-api-notice" role="status" aria-live="polite">打开面板后读取状态</div>
      <div id="secretProviderList" class="secret-provider-list" aria-live="polite">
        <div class="secret-empty">尚未读取 Provider 状态</div>
      </div>
    </div>
  </aside>

  <script>
    "use strict";

    // 一、服务端契约常量。TASK_SCHEMA_VERSION 必须与 state_payload 的 Schema 完全一致；
    // 版本不匹配时页面保留最后一次有效快照，而不是尽力猜测新字段含义。
    const STATUS_LABELS = {
      DRAFT: "草稿",
      NEEDS_REVIEW: "需确认",
      PENDING: "待执行",
      CLAIMED: "已领取",
      RUNNING: "执行中",
      WAITING_CONFLICT: "等待冲突",
      WAITING_HUMAN: "等待人工",
      BLOCKED: "已阻塞",
      STALLED: "已卡顿",
      SUCCEEDED: "已完成",
      CONFIRMED: "已确认",
      FAILED: "失败",
      CANCELLED: "已取消"
    };
    const PRIORITY_LABELS = { blocker: "阻断", critical: "紧急", high: "高", medium: "中", low: "低" };
    const CAPABILITY_LEVELS = ["L1", "L2", "L3", "L4", "L5"];
    const CAPABILITY_LABELS = Object.fromEntries(CAPABILITY_LEVELS.map((level) => [level, level]));
    const PREFLIGHT_LABELS = { UNINSPECTED: "待静态检查", INSPECTING: "静态检查中", READY: "已就绪", FAILED: "预检未通过" };
    const PREFLIGHT_STATUSES = new Set(Object.keys(PREFLIGHT_LABELS));
    const REVIEW_STATUSES = new Set(["NEEDS_REVIEW", "WAITING_HUMAN", "STALLED"]);
    const ACTIVE_STATUSES = new Set(["CLAIMED", "RUNNING"]);
    const CLOSED_STATUSES = new Set(["SUCCEEDED", "CONFIRMED", "FAILED", "CANCELLED"]);
    const LEGACY_QUEUE_STATUSES = new Set(["WAITING_CONFLICT", "BLOCKED"]);
    const PRIORITY_ORDER = { blocker: 0, critical: 1, high: 2, medium: 3, low: 4 };
    const VALID_STATUSES = new Set(Object.keys(STATUS_LABELS));
    const HEADER_FILTER_STATUSES = ["DRAFT", "NEEDS_REVIEW", "PENDING", "CLAIMED", "RUNNING", "WAITING_HUMAN", "STALLED", "SUCCEEDED", "CONFIRMED", "FAILED", "CANCELLED", "WAITING_CONFLICT", "BLOCKED"];
    const HEADER_FILTER_PRIORITIES = ["blocker", "critical", "high", "medium", "low"];
    const TASK_SCHEMA_VERSION = "3.7.0";
    const STATE_ENDPOINT = "/api/state";
    const TASK_ACTION_ENDPOINT = "/api/task-action";
    const SECRET_API_ENDPOINT = "/api/secrets";
    const SECRET_STATUS_LABELS = {
      not_configured: "未配置",
      configured_unverified: "已配置 · 未验证",
      valid: "有效",
      invalid: "无效",
      storage_unavailable: "存储不可用"
    };
    const RUNTIME_STATUS_LABELS = {
      HEALTHY: "正常",
      RESTARTED: "已恢复",
      RESTARTING: "恢复中",
      DISABLED: "已关闭",
      STOPPING: "停止中",
      STOP_FAILED: "停止失败",
      BLOCKED: "恢复受阻",
      UNHEALTHY: "异常",
      NEEDS_ATTENTION: "需要处理"
    };
    const IMAGE_EXTENSIONS = new Set(["avif", "gif", "jpeg", "jpg", "png", "webp"]);

    // 二、固定 DOM 索引。启动时集中查询，后续渲染只更新节点内容，避免反复查找和 ID 漂移。
    const elements = {
      openSettings: document.querySelector("#openSettings"),
      closeSettings: document.querySelector("#closeSettings"),
      settingsDrawer: document.querySelector("#settingsDrawer"),
      settingsScrim: document.querySelector("#settingsScrim"),
      secretApiNotice: document.querySelector("#secretApiNotice"),
      secretProviderList: document.querySelector("#secretProviderList"),
      notice: document.querySelector("#notice"),
      noticeText: document.querySelector("#noticeText"),
      dismissNotice: document.querySelector("#dismissNotice"),
      search: document.querySelector("#search"),
      statusFilter: document.querySelector("#statusFilter"),
      priorityFilter: document.querySelector("#priorityFilter"),
      environmentFilter: document.querySelector("#environmentFilter"),
      projectFilter: document.querySelector("#projectFilter"),
      profileFilter: document.querySelector("#profileFilter"),
      headerFilterMenu: document.querySelector("#headerFilterMenu"),
      taskTable: document.querySelector("#taskTable"),
      taskEmpty: document.querySelector("#taskEmpty"),
      taskRows: document.querySelector("#taskRows"),
      taskViewCount: document.querySelector("#taskViewCount"),
      metricDraft: document.querySelector("#metricDraft"),
      metricReview: document.querySelector("#metricReview"),
      metricPending: document.querySelector("#metricPending"),
      metricRunning: document.querySelector("#metricRunning"),
      metricConfirmation: document.querySelector("#metricConfirmation"),
      metricArchived: document.querySelector("#metricArchived"),
      distribution: document.querySelector("#distribution"),
      runtimeUpdated: document.querySelector("#runtimeUpdated"),
      runtimeSupervisor: document.querySelector("#runtimeSupervisor"),
      runtimePlanner: document.querySelector("#runtimePlanner"),
      runtimeDispatcher: document.querySelector("#runtimeDispatcher"),
      profileList: document.querySelector("#profileList"),
      profileCount: document.querySelector("#profileCount"),
      taskDialog: document.querySelector("#taskDialog"),
      dialogTitle: document.querySelector("#dialogTitle"),
      dialogSubtitle: document.querySelector("#dialogSubtitle"),
      dialogBody: document.querySelector("#dialogBody"),
      closeDialog: document.querySelector("#closeDialog")
    };

    // 三、纯前端临时状态。这里不是真实任务状态，刷新页面后可以安全丢失。
    // state 是最后一次通过 validateState() 的服务端快照；其余变量仅控制筛选、弹层和请求互斥。
    let state = null;
    let pollTimer = null;
    let currentFilter = "pending";
    let currentStatus = "all";
    let currentPriority = "all";
    let currentEnvironment = "all";
    let currentProject = "all";
    let currentProfile = "all";
    let currentQuery = "";
    let activeHeaderFilter = null;
    let availableProjects = [];
    let archivingTaskId = null;
    let recoveringExecutionId = null;
    let secretProviders = [];
    let secretCsrfToken = null;
    let secretRequestInFlight = false;
    let activeSecretForm = null;

    // 四、通用展示工具。所有进入 innerHTML 模板的服务端或任务文本都必须先 escapeHtml()。
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function statusClass(status) {
      return `status-${String(status).toLowerCase().replaceAll("_", "-")}`;
    }

    function showNotice(message) {
      elements.noticeText.textContent = message;
      elements.notice.classList.add("is-visible");
    }

    function hideNotice() {
      elements.notice.classList.remove("is-visible");
    }

    async function copyTaskId(taskId, button) {
      const feedback = button.querySelector(".copy-feedback");
      const setFeedback = (stateName, message) => {
        button.dataset.copyState = stateName;
        feedback.textContent = message;
        window.setTimeout(() => {
          if (button.dataset.copyState === stateName) delete button.dataset.copyState;
        }, 1800);
      };

      try {
        if (!navigator.clipboard?.writeText) throw new Error("剪贴板不可用");
        await navigator.clipboard.writeText(taskId);
        setFeedback("success", "已复制");
      } catch {
        setFeedback("failed", "复制失败");
      }
    }

    function formatDate(value, includeDate = true) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间无效";
      return new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        month: includeDate ? "2-digit" : undefined,
        day: includeDate ? "2-digit" : undefined,
        hour: "2-digit",
        minute: "2-digit",
        second: includeDate ? undefined : "2-digit",
        hour12: false
      }).format(date);
    }

    function runtimeTone(status) {
      if (["HEALTHY"].includes(status)) return "healthy";
      if (["RESTARTED"].includes(status)) return "active";
      if (["RESTARTING", "STOPPING"].includes(status)) return "warning";
      if (["STOP_FAILED", "BLOCKED", "UNHEALTHY", "NEEDS_ATTENTION"].includes(status)) return "danger";
      return "neutral";
    }

    function runtimeNodeMarkup(name, service) {
      const status = typeof service?.status === "string" ? service.status : "UNKNOWN";
      const tone = runtimeTone(status);
      const checkedAt = service?.heartbeat?.checked_at ?? service?.checked_at ?? null;
      const statusLabel = RUNTIME_STATUS_LABELS[status] ?? (status === "UNKNOWN" ? "无快照" : status);
      const message = typeof service?.message === "string" && service.message.trim()
        ? service.message
        : "尚未收到组件状态。";
      return `<article class="runtime-node" data-tone="${escapeHtml(tone)}">
        <div class="runtime-node-header">
          <span class="runtime-node-name">${escapeHtml(name)}</span>
          <span class="runtime-state" data-tone="${escapeHtml(tone)}"><span class="runtime-state-dot" aria-hidden="true"></span>${escapeHtml(statusLabel)}</span>
        </div>
        <div class="runtime-node-meta"><span>PID ${escapeHtml(service?.pid ?? "--")}</span><span>${escapeHtml(formatDate(checkedAt))}</span></div>
        <p class="runtime-node-message">${escapeHtml(message)}</p>
      </article>`;
    }

    function renderRuntimeChain(services) {
      const values = Array.isArray(services) ? services : [];
      const byComponent = new Map(values
        .filter((item) => item && typeof item.component === "string")
        .map((item) => [item.component, item]));
      const supervisor = byComponent.get("supervisor") ?? null;
      const planner = byComponent.get("planner") ?? null;
      const dispatcher = byComponent.get("dispatcher") ?? null;
      elements.runtimeSupervisor.innerHTML = runtimeNodeMarkup("Supervisor", supervisor);
      elements.runtimePlanner.innerHTML = runtimeNodeMarkup("Planner Scheduler", planner);
      elements.runtimeDispatcher.innerHTML = runtimeNodeMarkup("Dispatcher Scheduler", dispatcher);
      const timestamps = [supervisor, planner, dispatcher]
        .map((item) => item?.heartbeat?.checked_at ?? item?.checked_at)
        .map((value) => new Date(value ?? "").getTime())
        .filter(Number.isFinite);
      elements.runtimeUpdated.textContent = timestamps.length
        ? `快照 ${formatDate(new Date(Math.max(...timestamps)).toISOString())}`
        : "尚无快照";
    }

    // 五、SecretStore 抽屉。打开时读取非敏感状态，关闭时主动清空候选密钥和表单。
    function setSettingsDrawer(open) {
      elements.settingsDrawer.classList.toggle("is-open", open);
      elements.settingsDrawer.setAttribute("aria-hidden", String(!open));
      elements.settingsScrim.classList.toggle("is-visible", open);
      elements.settingsScrim.setAttribute("aria-hidden", String(!open));
      elements.openSettings.setAttribute("aria-expanded", String(open));
      if (open) {
        elements.closeSettings.focus();
        loadSecretProviders();
      } else {
        clearSecretCandidateInputs();
        activeSecretForm = null;
        elements.openSettings.focus();
      }
    }

    function setSecretNotice(message, mode = "") {
      elements.secretApiNotice.textContent = message;
      elements.secretApiNotice.classList.toggle("is-error", mode === "error");
      elements.secretApiNotice.classList.toggle("is-success", mode === "success");
    }

    function clearSecretCandidateInputs() {
      elements.settingsDrawer.querySelectorAll('input[type="password"], input[type="text"][data-secret-candidate]').forEach((input) => {
        input.value = "";
      });
      elements.settingsDrawer.querySelectorAll("form[data-secret-form]").forEach((form) => form.reset());
    }

    function providerDisplayName(providerId) {
      return providerId === "deepseek" ? "DeepSeek" : providerId;
    }

    function secretValidationLabel(provider) {
      if (!provider.last_validated_at) return "未验证";
      const scope = provider.validation_scope === "connection" ? "连接" : "本地";
      return `${scope} · ${formatDate(provider.last_validated_at)}`;
    }

    function secretFormMarkup(provider) {
      if (!activeSecretForm || activeSecretForm.providerId !== provider.provider_id) return "";
      const action = activeSecretForm.action;
      const isReplacement = action === "rotate";
      const inputId = `${provider.provider_id}-secret-candidate`;
      return `
        <form class="secret-form" data-secret-form data-provider-id="${escapeHtml(provider.provider_id)}" data-secret-form-action="${escapeHtml(action)}">
          <label class="secret-field-label" for="${escapeHtml(inputId)}">${isReplacement ? "新密钥" : "密钥"}</label>
          <div class="secret-input-row">
            <input id="${escapeHtml(inputId)}" class="secret-input" data-secret-candidate type="password" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="8" maxlength="8192" required aria-describedby="${escapeHtml(inputId)}-note">
            <button class="secret-toggle" type="button" data-toggle-secret aria-controls="${escapeHtml(inputId)}" aria-pressed="false">显示</button>
          </div>
          <span id="${escapeHtml(inputId)}-note" class="muted">输入不会写入浏览器存储</span>
          <label class="secret-connect-option"><input type="checkbox" data-connect-after-save> <span>保存后执行连接验证，可能产生一次 Provider 调用</span></label>
          <div class="secret-form-actions">
            <button class="secret-action-button" type="button" data-cancel-secret-form>取消</button>
            <button class="secret-action-button primary" type="submit"${secretRequestInFlight ? " disabled aria-busy=\"true\"" : ""}>${isReplacement ? "确认替换" : "保存"}</button>
          </div>
        </form>`;
    }

    function secretActionsMarkup(provider) {
      if (provider.status === "storage_unavailable") return "";
      const disabled = secretRequestInFlight ? " disabled" : "";
      if (!provider.configured) {
        return `<button class="secret-action-button primary" type="button" data-secret-action="set" data-provider-id="${escapeHtml(provider.provider_id)}"${disabled}>配置</button>`;
      }
      return `
        <button class="secret-action-button" type="button" data-secret-action="rotate" data-provider-id="${escapeHtml(provider.provider_id)}"${disabled}>替换</button>
        <button class="secret-action-button" type="button" data-secret-action="verify-local" data-provider-id="${escapeHtml(provider.provider_id)}"${disabled}>本地验证</button>
        <button class="secret-action-button" type="button" data-secret-action="verify-connect" data-provider-id="${escapeHtml(provider.provider_id)}"${disabled}>连接验证</button>
        <button class="secret-action-button danger" type="button" data-secret-action="delete" data-provider-id="${escapeHtml(provider.provider_id)}"${disabled}>删除</button>`;
    }

    function renderSecretProviders() {
      if (!secretProviders.length) {
        elements.secretProviderList.innerHTML = '<div class="secret-empty">没有可管理的 Provider</div>';
        return;
      }
      elements.secretProviderList.innerHTML = secretProviders.map((provider) => `
        <section class="secret-provider" data-secret-provider="${escapeHtml(provider.provider_id)}">
          <div class="secret-provider-header">
            <div><h3 class="secret-provider-name">${escapeHtml(providerDisplayName(provider.provider_id))}</h3><div class="secret-provider-id">${escapeHtml(provider.provider_id)}</div></div>
            <span class="secret-status" data-state="${escapeHtml(provider.status)}">${escapeHtml(SECRET_STATUS_LABELS[provider.status] ?? "状态未知")}</span>
          </div>
          <dl class="secret-meta">
            <dt>存储后端</dt><dd>${escapeHtml(provider.backend || "--")}</dd>
            <dt>最近验证</dt><dd>${escapeHtml(secretValidationLabel(provider))}</dd>
            <dt>持久化</dt><dd>${provider.persistent ? "是" : "否"}</dd>
          </dl>
          ${provider.repair ? `<p class="secret-repair">${escapeHtml(provider.repair)}</p>` : ""}
          <div class="secret-actions">${secretActionsMarkup(provider)}</div>
          ${secretFormMarkup(provider)}
        </section>
      `).join("");
    }

    async function loadSecretProviders({ preserveNotice = false } = {}) {
      if (!preserveNotice) setSecretNotice("正在读取 SecretStore 状态");
      try {
        const response = await fetch(SECRET_API_ENDPOINT, {
          cache: "no-store",
          credentials: "same-origin",
          headers: { "Accept": "application/json" }
        });
        const payload = await response.json();
        const csrfToken = response.headers.get("X-CSRF-Token");
        if (!response.ok || payload?.ok !== true || !Array.isArray(payload.providers) || !csrfToken) {
          throw new Error(payload?.error || `HTTP ${response.status}`);
        }
        secretProviders = payload.providers;
        secretCsrfToken = csrfToken;
        renderSecretProviders();
        if (!preserveNotice) setSecretNotice("SecretStore 状态已更新", "success");
        return true;
      } catch (error) {
        secretProviders = [];
        secretCsrfToken = null;
        renderSecretProviders();
        if (!preserveNotice) {
          setSecretNotice(`SecretStore 状态读取失败：${error instanceof Error ? error.message : String(error)}`, "error");
        }
        return false;
      }
    }

    /**
     * 执行一次 Provider 密钥变更。
     * 浏览器只保留当前同源响应下发的 CSRF token；request_id 防止重复提交。
     * JSON 序列化后立即清空 body.secret 和 requestBody 引用，最终真实持久化由服务端 SecretStore 完成。
     */
    async function mutateSecret(providerId, action, values = {}) {
      if (secretRequestInFlight || !secretCsrfToken || !crypto.randomUUID) return false;
      secretRequestInFlight = true;
      renderSecretProviders();
      const body = {
        provider_id: providerId,
        action,
        request_id: crypto.randomUUID(),
        ...values
      };
      let requestBody = JSON.stringify(body);
      if (Object.hasOwn(body, "secret")) body.secret = "";
      try {
        const pendingRequest = fetch(SECRET_API_ENDPOINT, {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": secretCsrfToken
          },
          body: requestBody
        });
        requestBody = "";
        const response = await pendingRequest;
        let payload = null;
        try { payload = await response.json(); } catch { /* HTTP 状态提供降级错误。 */ }
        if (!response.ok || payload?.ok !== true) throw new Error(payload?.error || `HTTP ${response.status}`);
        activeSecretForm = null;
        await loadSecretProviders({ preserveNotice: true });
        setSecretNotice("SecretStore 操作已完成", "success");
        return true;
      } catch (error) {
        await loadSecretProviders({ preserveNotice: true });
        setSecretNotice(`SecretStore 操作失败：${error instanceof Error ? error.message : String(error)}`, "error");
        return false;
      } finally {
        requestBody = "";
        secretRequestInFlight = false;
        clearSecretCandidateInputs();
        renderSecretProviders();
      }
    }

    async function submitSecretForm(form) {
      const providerId = form.dataset.providerId;
      const action = form.dataset.secretFormAction;
      const candidateInput = form.querySelector("[data-secret-candidate]");
      const connect = form.querySelector("[data-connect-after-save]").checked;
      let candidate = candidateInput.value;
      if (candidate.length < 8) {
        setSecretNotice("密钥格式无效", "error");
        candidateInput.focus();
        return;
      }
      if (action === "rotate" && !window.confirm(`确认替换 ${providerDisplayName(providerId)} 的现有密钥？`)) return;
      if (connect && !window.confirm("连接验证可能产生一次 Provider 调用。确认继续？")) return;
      const confirmation = action === "rotate"
        ? (connect ? "ROTATE_CONNECT" : "ROTATE")
        : (connect ? "CONNECT" : "SET");
      candidateInput.value = "";
      form.reset();
      const pending = mutateSecret(providerId, action, { secret: candidate, connect, confirmation });
      candidate = "";
      await pending;
    }

    async function runSecretAction(providerId, action) {
      if (action === "set" || action === "rotate") {
        activeSecretForm = { providerId, action };
        renderSecretProviders();
        elements.settingsDrawer.querySelector("[data-secret-candidate]")?.focus();
        return;
      }
      if (action === "delete") {
        if (!window.confirm(`确认删除 ${providerDisplayName(providerId)} 的密钥？此操作不能撤销。`)) return;
        await mutateSecret(providerId, "delete", { confirmation: "DELETE" });
        return;
      }
      const connect = action === "verify-connect";
      if (connect && !window.confirm("连接验证可能产生一次 Provider 调用。确认继续？")) return;
      await mutateSecret(providerId, "verify", {
        connect,
        confirmation: connect ? "CONNECT" : "VERIFY"
      });
    }

    function trapSettingsFocus(event) {
      if (event.key !== "Tab" || !elements.settingsDrawer.classList.contains("is-open")) return;
      const focusable = [...elements.settingsDrawer.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])')]
        .filter((item) => item.getClientRects().length > 0);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    // 六、时间、依赖和 scope 冲突投影。这里只解释服务端字段，不在前端推导新的锁状态。
    function formatDuration(start, end) {
      if (!start) return "--";
      const startTime = new Date(start).getTime();
      const endTime = end ? new Date(end).getTime() : Date.now();
      if (!Number.isFinite(startTime) || !Number.isFinite(endTime)) return "--";
      const seconds = Math.max(0, Math.floor((endTime - startTime) / 1000));
      if (seconds < 60) return `${seconds}秒`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}分钟`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}小时 ${minutes % 60}分`;
      return `${Math.floor(hours / 24)}天 ${hours % 24}小时`;
    }

    function formatTaskTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间无效";
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Shanghai",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);
      const time = Object.fromEntries(parts.map(({ type, value: partValue }) => [type, partValue]));
      return `${time.hour}:${time.minute}`;
    }

    function formatTaskDuration(task) {
      const startTime = new Date(task?.started_at).getTime();
      if (!Number.isFinite(startTime)) return "--";
      if (task.status === "RUNNING") return formatDuration(task.started_at, null);
      const completedTime = new Date(task?.completed_at).getTime();
      return Number.isFinite(completedTime) ? formatDuration(task.started_at, task.completed_at) : "--";
    }

    function taskTimeValue(value) {
      const formatted = formatTaskTime(value);
      return `<span class="task-time-value${formatted === "--" ? " is-placeholder" : ""}">${escapeHtml(formatted)}</span>`;
    }

    function taskDurationValue(task) {
      const formatted = formatTaskDuration(task);
      return `<span class="task-time-value${formatted === "--" ? " is-placeholder" : ""}">${escapeHtml(formatted)}</span>`;
    }

    function formatConflictDetectedAt(value) {
      if (!value) return "检测时间未记录";
      const timestamp = new Date(value);
      return Number.isNaN(timestamp.getTime()) ? "检测时间无效" : formatDate(value);
    }

    function dependencyIndicatorState(task, tasks) {
      const dependencyIds = Array.isArray(task?.depends_on) ? task.depends_on.filter((id) => typeof id === "string" && id.trim()) : [];
      if (!dependencyIds.length) return null;
      const tasksById = new Map((Array.isArray(tasks) ? tasks : [])
        .filter((candidate) => typeof candidate?.id === "string" && candidate.id)
        .map((candidate) => [candidate.id, candidate]));
      const statuses = dependencyIds.map((id) => tasksById.get(id)?.status);
      if (statuses.some((status) => ["DRAFT", "PENDING", "FAILED", "CANCELLED"].includes(status) || !VALID_STATUSES.has(status))) {
        return { color: "red", label: "依赖状态：存在未执行、失败、取消、缺失或异常依赖" };
      }
      if (statuses.some((status) => !["SUCCEEDED", "CONFIRMED"].includes(status))) {
        return { color: "yellow", label: "依赖状态：存在执行中或等待中的依赖" };
      }
      return { color: "green", label: "依赖状态：全部依赖已成功完成" };
    }

    function renderDependencyIndicator(task, tasks) {
      const indicator = dependencyIndicatorState(task, tasks);
      if (!indicator) return "";
      return `<span class="dependency-indicator is-${indicator.color}" role="img" aria-label="${escapeHtml(indicator.label)}" title="${escapeHtml(indicator.label)}"></span>`;
    }

    function scopeBlockGroups(task, tasks) {
      if (task?.status !== "PENDING" || !Array.isArray(task.blocked_by_task_ids) || task.blocked_by_task_ids.length === 0) return [];
      const tasksById = new Map((Array.isArray(tasks) ? tasks : [])
        .filter((candidate) => typeof candidate?.id === "string" && candidate.id)
        .map((candidate) => [candidate.id, candidate]));
      const scopeByKey = new Map((Array.isArray(task.scope_keys) ? task.scope_keys : []).map((key, index) => [key, task.scope?.[index] ?? key]));
      const detailed = Array.isArray(task.blocking_scopes) ? task.blocking_scopes : [];
      return task.blocked_by_task_ids.map((blockerId) => {
        const blockerTask = tasksById.get(blockerId);
        const keys = detailed
          .filter((item) => item?.blocker_task_id === blockerId)
          .map((item) => item.requested_scope_key)
          .filter(Boolean);
        const fallbackKeys = Array.isArray(task.blocked_scope_keys) ? task.blocked_scope_keys : [];
        const scopeKeys = [...new Set(keys.length ? keys : fallbackKeys)];
        return {
          blockerId,
          blockerTitle: typeof blockerTask?.title === "string" ? blockerTask.title.trim() : "",
          scopes: scopeKeys.map((scopeKey) => ({ scopeKey, scope: scopeByKey.get(scopeKey) ?? scopeKey }))
        };
      });
    }

    function conflictGroupMarkup(group) {
      const title = group.blockerTitle || (group.blockerId ? "阻塞任务标题未找到" : "未知阻塞任务");
      const blockerId = group.blockerId || "阻塞任务 ID 未记录";
      return `<div class="conflict-group">
        <strong class="conflict-task-title">${escapeHtml(title)}</strong>
        <code class="conflict-task-id" title="${escapeHtml(blockerId)}">${escapeHtml(blockerId)}</code>
        <ul class="conflict-scopes">${group.scopes.map((scope) => `
          <li>
            <code class="conflict-scope" title="${escapeHtml(scope.scopeKey)}">${escapeHtml(scope.scope)}</code>
            <span class="conflict-detected">scope_key：${escapeHtml(scope.scopeKey)}</span>
          </li>`).join("")}
        </ul>
      </div>`;
    }

    function renderScopeBlockIndicator(task, tasks) {
      const groups = scopeBlockGroups(task, tasks);
      if (!groups.length) return "";
      const first = groups[0];
      const firstLabel = first.blockerTitle || first.blockerId || "未知阻塞任务";
      const suffix = groups.length > 1 ? ` +${groups.length - 1}` : "";
      const queuePosition = Number.isInteger(task.scope_queue_position) ? ` · 队列 ${task.scope_queue_position}` : "";
      return `<details class="queue-summary">
        <summary title="范围锁等待">范围等待：${escapeHtml(firstLabel)}${escapeHtml(suffix)}${escapeHtml(queuePosition)}</summary>
        <div class="conflict-popover" aria-label="阻塞任务详情">${groups.map(conflictGroupMarkup).join("")}</div>
      </details>`;
    }

    function renderPendingBlockers(task, tasks) {
      if (task.status !== "PENDING") return "";
      const dependencyIds = Array.isArray(task.depends_on) ? task.depends_on : [];
      const tasksById = new Map((Array.isArray(tasks) ? tasks : []).map((candidate) => [candidate.id, candidate]));
      const dependencyItems = dependencyIds.length ? `<ul>${dependencyIds.map((id) => {
        const dependency = tasksById.get(id);
        return `<li><code>${escapeHtml(id)}</code> · ${escapeHtml(STATUS_LABELS[dependency?.status] ?? dependency?.status ?? "未找到")}</li>`;
      }).join("")}</ul>` : '<p class="muted">无依赖等待</p>';
      const scopeGroups = scopeBlockGroups(task, tasks);
      const scopeItems = scopeGroups.length
        ? `<div class="conflict-detail-list">${scopeGroups.map(conflictGroupMarkup).join("")}</div>`
        : '<p class="muted">无范围锁等待</p>';
      const affectedScopes = Array.isArray(task.blocked_scopes) && task.blocked_scopes.length
        ? `<p>受影响范围：${task.blocked_scopes.map((scope) => `<code>${escapeHtml(scope)}</code>`).join("、")}</p>`
        : "";
      const position = Number.isInteger(task.scope_queue_position) ? `<p>当前范围队列位置：${escapeHtml(task.scope_queue_position)}</p>` : "";
      return `<section class="detail-block"><h3>待执行阻塞</h3><h4>依赖等待</h4>${dependencyItems}<h4>范围锁等待</h4>${scopeItems}${affectedScopes}${position}</section>`;
    }

    // 七、任务路由和执行配置展示。项目来自规范化 scope key，模型信息来自 runtime_config。
    function scopeKeyProject(key) {
      if (typeof key !== "string") return null;
      if (key.startsWith("project:")) {
        const project = key.slice("project:".length);
        return project && !project.includes(":") ? project : null;
      }
      const match = /^(?:file|module):([^:]+)::(.+)$/.exec(key);
      return match?.[1] ?? null;
    }

    function hintedScopeProject(scope) {
      if (typeof scope !== "string") return null;
      const normalized = scope.replaceAll("\\", "/").replace(/^\.\//, "");
      const projects = Array.isArray(state?.projects) ? state.projects : [];
      const matches = projects
        .map((project) => String(project?.path ?? "").replaceAll("\\", "/").replace(/\/$/, ""))
        .filter((project) => project && (normalized === project || normalized.startsWith(`${project}/`)))
        .sort((left, right) => right.length - left.length);
      return matches[0] ?? null;
    }

    function taskProjects(task) {
      const scopes = Array.isArray(task.scope) ? task.scope : [];
      const keys = Array.isArray(task.scope_keys) ? task.scope_keys : [];
      const projectScopes = new Map();
      keys.forEach((key, index) => {
        const project = scopeKeyProject(key);
        if (!project) return;
        if (!projectScopes.has(project)) projectScopes.set(project, []);
        projectScopes.get(project).push(String(scopes[index] ?? "").replaceAll("\\", "/"));
      });
      if (!projectScopes.size) {
        const hints = Array.isArray(task.scope_hint) ? task.scope_hint : [];
        hints.forEach((scope) => {
          const project = hintedScopeProject(scope);
          if (!project) return;
          if (!projectScopes.has(project)) projectScopes.set(project, []);
          projectScopes.get(project).push(String(scope).replaceAll("\\", "/"));
        });
      }
      if (projectScopes.size > 1) {
        const loopScopes = projectScopes.get("local-agent-loop") ?? [];
        if (loopScopes.length && loopScopes.every((scope) => scope.startsWith("local-agent-loop/assets/"))) {
