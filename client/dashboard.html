          projectScopes.delete("local-agent-loop");
        }
      }
      return [...projectScopes.keys()];
    }

    function projectCell(task) {
      const projects = taskProjects(task);
      if (!projects.length) return '<span class="muted">未识别</span>';
      return `<div class="project-cell">
        ${projects.map((project) => `<span class="project-badge" title="${escapeHtml(project)}">${escapeHtml(project)}</span>`).join("")}
      </div>`;
    }

    function executionConfig(environment, providerId, capabilityLevel, candidate = state) {
      const profile = candidate?.runtime_config?.execution_profiles?.[environment];
      if (environment === "self_hosted_agent") {
        return profile?.providers?.[providerId]?.capabilities?.[capabilityLevel] ?? null;
      }
      return profile?.capabilities?.[capabilityLevel] ?? null;
    }

    function executionConfigLabel(config) {
      if (!config?.model) return "配置不可用";
      return `${config.model} · ${config.reasoning ?? "unknown"} · ${config.attempt_timeout_seconds ?? "--"}s · 重试 ${config.max_retries ?? "--"}`;
    }

    function providerLabel(providerId) {
      return providerId ? ` · ${providerId}` : "";
    }

    function profileCell(task) {
      if (!task.capability_level) return '<span class="muted">待预检</span>';
      const config = executionConfig(task.runtime_environment, task.provider_id, task.capability_level);
      return `<span class="profile-badge profile-${escapeHtml(task.capability_level)}" title="${escapeHtml(executionConfigLabel(config))}">${escapeHtml(CAPABILITY_LABELS[task.capability_level] ?? task.capability_level)}</span>`;
    }

    function runtimeEnvironmentEntries(candidate = state) {
      return Object.entries(candidate?.runtime_config?.runtime_environments ?? {});
    }

    function runtimeEnvironmentName(environment, candidate = state) {
      if (environment === "self_hosted_agent") return "DeepSeek";
      return candidate?.runtime_config?.runtime_environments?.[environment]?.name ?? environment;
    }

    function environmentCell(task) {
      const environment = task.runtime_environment;
      return `<span class="environment-badge" title="${escapeHtml(`${environment}${providerLabel(task.provider_id)}`)}">${escapeHtml(runtimeEnvironmentName(environment) + providerLabel(task.provider_id))}</span>`;
    }

    // 八、表头联动筛选。计算某列候选项时忽略该列自身条件，保留其他列和一级分类条件，
    // 因此下拉菜单只出现当前结果集中真实存在且选择后仍可能有结果的值。
    function headerFilterOptions(kind, tasks = state?.tasks ?? []) {
      const contextualTasks = tasks.filter((task) => taskMatches(task, kind));
      if (kind === "status") {
        const values = new Set(contextualTasks.map((task) => task.status));
        return [["all", "全部状态"], ...HEADER_FILTER_STATUSES.filter((status) => values.has(status)).map((status) => [status, `${STATUS_LABELS[status]} (${status})`])];
      }
      if (kind === "priority") {
        const values = new Set(contextualTasks.map((task) => task.priority));
        return [["all", "全部优先级"], ...HEADER_FILTER_PRIORITIES.filter((priority) => values.has(priority)).map((priority) => [priority, `${PRIORITY_LABELS[priority]} (${priority})`])];
      }
      if (kind === "project") {
        availableProjects = [...new Set(contextualTasks.flatMap(taskProjects))]
          .sort((left, right) => left.localeCompare(right, "zh-CN"));
        return [["all", "全部项目"], ...availableProjects.map((project) => [project, project])];
      }
      if (kind === "environment") {
        const values = new Set(contextualTasks.map((task) => task.runtime_environment));
        return [["all", "全部环境"], ...runtimeEnvironmentEntries().filter(([environment]) => values.has(environment)).map(([environment, config]) => [environment, runtimeEnvironmentName(environment, state) || config.name])];
      }
      const values = new Set(contextualTasks.map((task) => task.capability_level));
      return [["all", "全部能力等级"], ...CAPABILITY_LEVELS.filter((level) => values.has(level)).map((level) => [level, CAPABILITY_LABELS[level]])];
    }

    function resetInvalidHeaderFilters(tasks) {
      ["status", "priority", "environment", "project", "profile"].forEach((kind) => {
        const selected = selectedHeaderFilterValue(kind);
        const validValues = new Set(headerFilterOptions(kind, tasks).map(([value]) => value));
        if (selected !== "all" && !validValues.has(selected)) setHeaderFilterValue(kind, "all");
      });
    }

    function selectedHeaderFilterValue(kind) {
      if (kind === "status") return currentStatus;
      if (kind === "priority") return currentPriority;
      if (kind === "environment") return currentEnvironment;
      return kind === "project" ? currentProject : currentProfile;
    }

    function renderHeaderFilterButtons() {
      [["status", elements.statusFilter], ["priority", elements.priorityFilter], ["environment", elements.environmentFilter], ["project", elements.projectFilter], ["profile", elements.profileFilter]].forEach(([kind, button]) => {
        const active = selectedHeaderFilterValue(kind) !== "all";
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      if (activeHeaderFilter) renderHeaderFilterMenu();
    }

    function positionHeaderFilterMenu(trigger) {
      const rect = trigger.getBoundingClientRect();
      const menu = elements.headerFilterMenu;
      menu.style.left = `${Math.max(12, Math.min(rect.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 12))}px`;
      menu.style.top = `${Math.min(rect.bottom + 6, window.innerHeight - menu.offsetHeight - 12)}px`;
    }

    function renderHeaderFilterMenu() {
      if (!activeHeaderFilter) return;
      const trigger = elements[`${activeHeaderFilter}Filter`];
      const selected = selectedHeaderFilterValue(activeHeaderFilter);
      elements.headerFilterMenu.innerHTML = headerFilterOptions(activeHeaderFilter).map(([value, label]) => `
        <button class="header-filter-option" type="button" role="menuitemradio" aria-checked="${value === selected}" data-header-filter-kind="${activeHeaderFilter}" data-header-filter-value="${escapeHtml(value)}">${escapeHtml(label)}</button>`).join("");
      elements.headerFilterMenu.hidden = false;
      positionHeaderFilterMenu(trigger);
    }

    function closeHeaderFilterMenu({ restoreFocus = false } = {}) {
      if (!activeHeaderFilter) return;
      const trigger = elements[`${activeHeaderFilter}Filter`];
      activeHeaderFilter = null;
      elements.headerFilterMenu.hidden = true;
      elements.statusFilter.setAttribute("aria-expanded", "false");
      elements.priorityFilter.setAttribute("aria-expanded", "false");
      elements.environmentFilter.setAttribute("aria-expanded", "false");
      elements.projectFilter.setAttribute("aria-expanded", "false");
      elements.profileFilter.setAttribute("aria-expanded", "false");
      if (restoreFocus) trigger.focus();
    }

    function openHeaderFilter(kind) {
      if (activeHeaderFilter === kind) {
        closeHeaderFilterMenu({ restoreFocus: true });
        return;
      }
      activeHeaderFilter = kind;
      elements.statusFilter.setAttribute("aria-expanded", String(kind === "status"));
      elements.priorityFilter.setAttribute("aria-expanded", String(kind === "priority"));
      elements.environmentFilter.setAttribute("aria-expanded", String(kind === "environment"));
      elements.projectFilter.setAttribute("aria-expanded", String(kind === "project"));
      elements.profileFilter.setAttribute("aria-expanded", String(kind === "profile"));
      renderHeaderFilterMenu();
      elements.headerFilterMenu.querySelector(".header-filter-option[aria-checked=\"true\"]")?.focus();
    }

    function setHeaderFilterValue(kind, value) {
      if (kind === "status") currentStatus = value;
      else if (kind === "priority") currentPriority = value;
      else if (kind === "environment") currentEnvironment = value;
      else if (kind === "project") currentProject = value;
      else currentProfile = value;
    }

    function setHeaderFilter(kind, value) {
      setHeaderFilterValue(kind, value);
      closeHeaderFilterMenu({ restoreFocus: true });
      if (state) resetInvalidHeaderFilters(state.tasks);
      renderHeaderFilterButtons();
      if (state) renderTasks(state.tasks);
    }

    /**
     * 校验 /api/state 的完整前端契约。
     * 该检查是 UI 防御边界，不替代数据库 validate；任何关键字段、状态枚举、路由或恢复记录异常
     * 都拒绝整份快照，防止部分新数据与旧 DOM 混合后显示出不存在的任务状态。
     */
    function validateState(candidate) {
      const errors = [];
      if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) errors.push("根节点必须是对象");
      if (candidate?.schema_version !== TASK_SCHEMA_VERSION) {
        errors.push(`schema_version 必须为 ${TASK_SCHEMA_VERSION}`);
      }
      if (!candidate?.workspace || !Number.isInteger(candidate.workspace.revision)) errors.push("workspace.revision 无效");
      if (!Array.isArray(candidate?.tasks)) errors.push("tasks 必须是数组");
      if (!Array.isArray(candidate?.agents)) errors.push("agents 必须是数组");
      if (!Array.isArray(candidate?.recoveries)) errors.push("recoveries 必须是数组");
      if (!Array.isArray(candidate?.services)) errors.push("services 必须是数组");
      const environmentConfig = candidate?.runtime_config?.runtime_environments;
      if (!environmentConfig || typeof environmentConfig !== "object" || Array.isArray(environmentConfig) || !Object.keys(environmentConfig).length) {
        errors.push("runtime_config.runtime_environments 无效");
      }
      const validRuntimeEnvironments = new Set(Object.keys(environmentConfig ?? {}));
      for (const [environment, config] of Object.entries(environmentConfig ?? {})) {
        if (!config || typeof config.name !== "string" || !config.name.trim()) errors.push(`运行环境 ${environment} 配置无效`);
      }
      const ids = new Set();
      for (const [index, task] of (candidate?.tasks ?? []).entries()) {
        if (task && typeof task === "object") {
          task.blocked_by_task_ids ??= [];
          task.blocked_scopes ??= [];
          task.blocked_scope_keys ??= [];
          task.blocking_scopes ??= [];
          task.scope_queue_position ??= null;
        }
        if (!task?.id || ids.has(task.id)) errors.push(`tasks[${index}].id 缺失或重复`);
        ids.add(task?.id);
        if (!Number.isInteger(task?.row_version) || task.row_version < 1) errors.push(`任务 ${task?.id ?? index} row_version 无效`);
        if (!VALID_STATUSES.has(task?.status)) errors.push(`任务 ${task?.id ?? index} 状态无效`);
        if (!PREFLIGHT_STATUSES.has(task?.preflight_status)) errors.push(`任务 ${task?.id ?? index} preflight_status 无效`);
        if (!Object.hasOwn(PRIORITY_ORDER, task?.priority)) errors.push(`任务 ${task?.id ?? index} 优先级无效`);
        if (task?.capability_level !== null && !CAPABILITY_LEVELS.includes(task?.capability_level)) errors.push(`任务 ${task?.id ?? index} 能力等级无效`);
        if (!CAPABILITY_LEVELS.includes(task?.estimated_capability_level)) errors.push(`任务 ${task?.id ?? index} 预估能力等级无效`);
        if (!task?.runtime_environment || !validRuntimeEnvironments.has(task.runtime_environment)) {
          errors.push(`任务 ${task?.id ?? index} 运行环境缺失或未知`);
        }
        if (task?.runtime_environment === "self_hosted_agent" && (!task?.provider_id || !executionConfig(task.runtime_environment, task.provider_id, task.capability_level, candidate))) {
          errors.push(`任务 ${task?.id ?? index} Provider 缺失或未知`);
        }
        if (task?.runtime_environment !== "self_hosted_agent" && task?.provider_id !== null) {
          errors.push(`任务 ${task?.id ?? index} Provider 路由无效`);
        }
        if (task?.depends_on !== undefined && (!Array.isArray(task.depends_on) || task.depends_on.some((id) => typeof id !== "string"))) {
          errors.push(`任务 ${task?.id ?? index} depends_on 无效`);
        }
        if (!task?.operator_definition || typeof task.operator_definition !== "object" || Array.isArray(task.operator_definition)) {
          errors.push(`任务 ${task?.id ?? index} operator_definition 无效`);
        }
        if (!task?.planner_supplement || typeof task.planner_supplement !== "object" || Array.isArray(task.planner_supplement)) {
          errors.push(`任务 ${task?.id ?? index} planner_supplement 无效`);
        }
        if (!Array.isArray(task?.blocked_by_task_ids) || !Array.isArray(task?.blocked_scopes) || !Array.isArray(task?.blocked_scope_keys)) {
          errors.push(`任务 ${task?.id ?? index} 待执行阻塞字段无效`);
        }
        if (!task?.result || typeof task.result !== "object" || Array.isArray(task.result)) {
          errors.push(`任务 ${task?.id ?? index} result 无效`);
        } else if (task.result.diagnostic !== null && task.result.diagnostic !== undefined && (
          typeof task.result.diagnostic !== "object" || Array.isArray(task.result.diagnostic)
        )) {
          errors.push(`任务 ${task?.id ?? index} result.diagnostic 无效`);
        }
        if (!Number.isInteger(task?.progress?.percent) || task.progress.percent < 0 || task.progress.percent > 100) {
          errors.push(`任务 ${task?.id ?? index} 进度无效`);
        }
      }
      for (const [index, agent] of (candidate?.agents ?? []).entries()) {
        if (!agent?.runtime_environment || !validRuntimeEnvironments.has(agent.runtime_environment)) {
          errors.push(`活动 execution ${agent?.id ?? index} 运行环境缺失或未知`);
        }
        if (!CAPABILITY_LEVELS.includes(agent?.capability_level)) errors.push(`活动 execution ${agent?.id ?? index} 能力等级无效`);
        if (agent?.runtime_environment === "self_hosted_agent" && (!agent?.provider_id || !executionConfig(agent.runtime_environment, agent.provider_id, agent.capability_level, candidate))) {
          errors.push(`活动 execution ${agent?.id ?? index} Provider 缺失或未知`);
        }
      }
      for (const [index, recovery] of (candidate?.recoveries ?? []).entries()) {
        if (!recovery?.execution_id || !ids.has(recovery?.task_id)) errors.push(`恢复记录 ${index} 标识无效`);
        if (!["STALLED", "TIMED_OUT"].includes(recovery?.execution_status)) errors.push(`恢复记录 ${index} execution 状态无效`);
        if (recovery?.scope_status !== "QUARANTINED" || !Array.isArray(recovery?.scope_keys) || !recovery.scope_keys.length) {
          errors.push(`恢复记录 ${index} scope 隔离状态无效`);
        }
      }
      if (errors.length) throw new Error(errors.join("；"));
      return candidate;
    }

    // 九、轮询状态应用。只有完整校验成功才替换全局 state，失败时继续展示上一份有效数据。
    function applyState(candidate) {
      try {
        state = validateState(candidate);
        render();
        hideNotice();
        return true;
      } catch (error) {
        showNotice(`未应用无效内容，页面保留最后一次有效数据。${error instanceof Error ? error.message : String(error)}`);
        return false;
      }
    }

    async function refreshState() {
      try {
        const response = await fetch(STATE_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return applyState(await response.json());
      } catch (error) {
        showNotice(`无法读取 ${STATE_ENDPOINT}。${error instanceof Error ? error.message : String(error)}`);
        return false;
      }
    }

    function startPolling() {
      stopPolling();
      const interval = Math.max(500, state?.runtime_config?.dashboard?.poll_interval_ms ?? 2000);
      pollTimer = window.setInterval(refreshState, interval);
    }

    function stopPolling() {
      if (pollTimer !== null) window.clearInterval(pollTimer);
      pollTimer = null;
    }

    // 十、列表筛选。archived_at 与任务 status 独立处理，避免把“归档”误当成状态机终态。
    function taskMatches(task, ignoredHeaderFilter = null) {
      const archived = isArchived(task);
      if (currentFilter === "archived") {
        if (!archived) return false;
      } else if (archived) {
        return false;
      }
      if (currentFilter === "draft" && task.status !== "DRAFT") return false;
      if (currentFilter === "review" && !REVIEW_STATUSES.has(task.status)) return false;
      if (currentFilter === "pending" && task.status !== "PENDING" && !LEGACY_QUEUE_STATUSES.has(task.status)) return false;
      if (currentFilter === "active" && !ACTIVE_STATUSES.has(task.status)) return false;
      if (currentFilter === "closed" && !CLOSED_STATUSES.has(task.status)) return false;
      if (ignoredHeaderFilter !== "status" && currentStatus !== "all" && task.status !== currentStatus) return false;
      if (ignoredHeaderFilter !== "priority" && currentPriority !== "all" && task.priority !== currentPriority) return false;
      if (ignoredHeaderFilter !== "environment" && currentEnvironment !== "all" && task.runtime_environment !== currentEnvironment) return false;
      if (ignoredHeaderFilter !== "project" && currentProject !== "all" && !taskProjects(task).includes(currentProject)) return false;
      if (ignoredHeaderFilter !== "profile" && currentProfile !== "all" && task.capability_level !== currentProfile) return false;
      if (!currentQuery) return true;
      return [task.id, task.title, task.description, ...taskProjects(task)]
        .filter(Boolean)
        .some((value) => String(value).toLocaleLowerCase("zh-CN").includes(currentQuery));
    }

    function isArchived(task) {
      return Boolean(task?.archived_at);
    }

    function canArchiveTask(task) {
      return currentFilter === "closed" && !isArchived(task) && CLOSED_STATUSES.has(task.status);
    }

    function recoveryForTask(task) {
      return (state?.recoveries ?? []).find((recovery) => recovery.task_id === task.id) ?? null;
    }

    function renderTaskAction(task) {
      const recovery = recoveryForTask(task);
      if (recovery) {
        const submitting = recoveringExecutionId === recovery.execution_id;
        return `<button class="recovery-button" type="button" data-open-recovery-task="${escapeHtml(task.id)}" aria-label="处置隔离任务 ${escapeHtml(task.id)}" title="处置隔离"${submitting ? " disabled aria-busy=\"true\"" : ""}><span aria-hidden="true">!</span><span>处置</span></button>`;
      }
      if (!canArchiveTask(task)) return "";
      const submitting = archivingTaskId === task.id;
      return `<button class="archive-button${submitting ? " is-submitting" : ""}" type="button" data-archive-task-id="${escapeHtml(task.id)}" aria-label="归档任务 ${escapeHtml(task.id)}" title="归档任务"${submitting ? " disabled aria-busy=\"true\"" : ""}><span class="archive-icon" aria-hidden="true">${submitting ? "↻" : "⇩"}</span><span>归档</span></button>`;
    }

    /**
     * 处置 STALLED/TIMED_OUT execution 的隔离锁。
     * 前端必须取得人工确认并提交当前 row_version；真正的进程终止确认、状态迁移和解锁由服务端完成。
     */
    async function recoverTask(taskId, executionId, recoveryAction) {
      const task = state?.tasks?.find((candidate) => candidate.id === taskId);
      const recovery = recoveryForTask(task ?? {});
      if (!task || !recovery || recovery.execution_id !== executionId || recoveringExecutionId !== null) return;
      const labels = { requeue: "释放隔离并重新排队", failed: "释放隔离并标记失败", wait: "继续等待并保持隔离" };
      if (!window.confirm(`确认旧 Codex 客户端会话 ${executionId} 已结束，并执行“${labels[recoveryAction]}”？`)) return;
      recoveringExecutionId = executionId;
      if (state) renderTasks(state.tasks);
      try {
        const response = await fetch(TASK_ACTION_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            task_id: task.id,
            action: "recover",
            execution_id: executionId,
            recovery_action: recoveryAction,
            row_version: task.row_version,
            confirmed_safe: true
          })
        });
        let payload = null;
        try { payload = await response.json(); } catch { /* HTTP 状态提供降级错误。 */ }
        if (!response.ok || payload?.ok !== true) throw new Error(payload?.error || `HTTP ${response.status}`);
        elements.taskDialog.close();
        const refreshed = await refreshState();
        if (!refreshed) showNotice("恢复处置已提交，但状态刷新失败，请稍后重新加载。");
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        await refreshState();
        showNotice(`恢复处置失败：${message}`);
      } finally {
        recoveringExecutionId = null;
        if (state) renderTasks(state.tasks);
      }
    }

    /**
     * 归档一个未归档终态任务。SUCCEEDED 会由服务端先执行人工确认再写 archived_at；
     * row_version 用于拒绝基于旧页面快照的并发操作，前端不得自行修改任务对象模拟成功。
     */
    async function archiveTask(taskId) {
      const task = state?.tasks?.find((candidate) => candidate.id === taskId);
      if (!task || !canArchiveTask(task) || archivingTaskId !== null) return;
      const confirmation = task.status === "SUCCEEDED"
        ? `任务 ${task.id} 尚未人工确认。继续将先执行人工确认，再归档该任务。`
        : `确认归档任务 ${task.id}？任务状态和执行记录将保持不变。`;
      if (!window.confirm(confirmation)) return;

      archivingTaskId = task.id;
      renderTasks(state.tasks);
      try {
        const response = await fetch(TASK_ACTION_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: task.id, action: "archive", row_version: task.row_version })
        });
        let payload = null;
        try { payload = await response.json(); } catch { /* HTTP 状态提供降级错误。 */ }
        if (!response.ok || payload?.ok !== true) {
          throw new Error(payload?.error || `HTTP ${response.status}`);
        }
        const refreshed = await refreshState();
        if (!refreshed) showNotice("归档已完成，但列表刷新失败，请稍后重新加载。");
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        await refreshState();
        showNotice(`归档失败：${message}`);
      } finally {
        archivingTaskId = null;
        if (state) renderTasks(state.tasks);
      }
    }

    function isHeartbeatLate(task) {
      if (!ACTIVE_STATUSES.has(task.status) || !task.heartbeat_at) return false;
      const threshold = (state?.settings?.stalled_after_seconds ?? 300) * 1000;
      return Date.now() - new Date(task.heartbeat_at).getTime() > threshold;
    }

    // 十一、主渲染入口：先聚合顶部统计，再校正已失效筛选，最后渲染任务表和容量卡。
    function render() {
      const tasks = state?.tasks ?? [];
      const currentTasks = tasks.filter((task) => !isArchived(task));
      const archived = tasks.filter(isArchived).length;
      const counts = currentTasks.reduce((result, task) => {
        result[task.status] = (result[task.status] ?? 0) + 1;
        return result;
      }, {});
      const succeeded = (counts.SUCCEEDED ?? 0) + (counts.CONFIRMED ?? 0);
      const running = (counts.RUNNING ?? 0) + (counts.CLAIMED ?? 0);
      const failed = counts.FAILED ?? 0;
      const drafts = counts.DRAFT ?? 0;
      const review = [...REVIEW_STATUSES].reduce((totalCount, status) => totalCount + (counts[status] ?? 0), 0);
      const pending = counts.PENDING ?? 0;
      const confirmation = [...CLOSED_STATUSES].reduce((totalCount, status) => totalCount + (counts[status] ?? 0), 0);
      const queued = drafts + pending;
      const total = currentTasks.length;

      elements.metricDraft.textContent = drafts;
      elements.metricReview.textContent = review;
      elements.metricPending.textContent = pending;
      elements.metricRunning.textContent = running;
      elements.metricConfirmation.textContent = confirmation;
      elements.metricArchived.textContent = archived;
      const widths = [succeeded, running, review, failed, queued].map((value) => total ? `${(value / total) * 100}%` : "0%");
      [...elements.distribution.children].forEach((child, index) => { child.style.width = widths[index]; });
      elements.distribution.setAttribute("aria-label", `任务状态分布：完成 ${succeeded}，执行中 ${running}，需确认 ${review}，失败 ${failed}，待处理 ${queued}`);

      resetInvalidHeaderFilters(tasks);
      renderHeaderFilterButtons();
      renderRuntimeChain(state.services);
      renderTasks(tasks);
      renderProfiles(currentTasks, state.agents ?? []);
    }

    // 任务排序固定为优先级、更新时间；任务名、ID、状态、项目和结果文本必须经过 HTML 转义。
    function renderTasks(tasks) {
      const visible = tasks
        .filter(taskMatches)
        .sort((left, right) => {
          const priorityDifference = (PRIORITY_ORDER[left.priority] ?? 9) - (PRIORITY_ORDER[right.priority] ?? 9);
          if (priorityDifference !== 0) return priorityDifference;
          return new Date(right.updated_at).getTime() - new Date(left.updated_at).getTime();
        });

      elements.taskViewCount.textContent = currentFilter === "archived"
        ? `已归档 ${visible.length} 项`
        : `当前 ${visible.length} 项`;

      elements.taskRows.innerHTML = visible.map((task) => `
        <tr tabindex="0" data-task-id="${escapeHtml(task.id)}" aria-label="查看任务 ${escapeHtml(task.title)}">
          <td class="task-cell">
            <div class="task-title-line">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <button class="task-copy-button" type="button" data-copy-task-id="${escapeHtml(task.id)}" aria-label="复制任务 ID" title="复制任务 ID">
                <span class="copy-icon" aria-hidden="true">⧉</span>
                <span class="copy-feedback" aria-live="polite"></span>
              </button>
            </div>
            <span class="task-id">${escapeHtml(task.id)}</span>
          </td>
          <td class="status-cell" data-label="状态"><div class="status-stack">
            <div class="status-badge-row"><span class="status-badge ${statusClass(task.status)}">${escapeHtml(task.status === "DRAFT" ? `${STATUS_LABELS[task.status]} · ${PREFLIGHT_LABELS[task.preflight_status]}` : STATUS_LABELS[task.status])}${isHeartbeatLate(task) ? " · 心跳超时" : ""}</span>${renderDependencyIndicator(task, tasks)}</div>
            ${recoveryForTask(task) ? `<span class="recovery-state">${escapeHtml(recoveryForTask(task).execution_status)} · scope 隔离</span>` : ""}
            ${isArchived(task) ? `<span class="archive-time">归档于 ${escapeHtml(formatDate(task.archived_at, false))}</span>` : ""}
            ${renderScopeBlockIndicator(task, tasks)}
          </div></td>
          <td data-label="优先级"><span class="priority-badge priority-${escapeHtml(task.priority)}">${escapeHtml(PRIORITY_LABELS[task.priority] ?? task.priority)}</span></td>
          <td data-label="能力等级">${profileCell(task)}</td>
          <td data-label="运行环境">${environmentCell(task)}</td>
          <td data-label="项目">${projectCell(task)}</td>
          <td data-label="时间"><div class="task-time-info">
            <div class="task-time-row"><span class="task-time-label">开始</span>${taskTimeValue(task.started_at)}</div>
            <div class="task-time-row"><span class="task-time-label">完成</span>${taskTimeValue(task.completed_at)}</div>
            <div class="task-time-row"><span class="task-time-label">耗时</span>${taskDurationValue(task)}</div>
          </div></td>
          <td class="task-action-cell" data-label="操作">${renderTaskAction(task)}</td>
        </tr>
      `).join("");

      elements.taskTable.hidden = visible.length === 0;
      elements.taskEmpty.hidden = visible.length > 0;
      if (tasks.length === 0) {
        elements.taskEmpty.innerHTML = "<div><strong>当前没有任务</strong><span>任务文件已连接</span></div>";
      } else if (visible.length === 0) {
        elements.taskEmpty.innerHTML = "<div><strong>没有匹配任务</strong><span>调整筛选条件或搜索内容</span></div>";
      }
    }

    function renderProfiles(tasks, agents) {
      const levelProfiles = { L1: "routine", L2: "standard", L3: "advanced", L4: "deep", L5: "complex" };
      const profileParallelLimits = state?.settings?.profile_parallel_limits ?? {};
      const totalActive = agents.length;
      const totalLimit = state?.settings?.global_max_active_executions ?? "--";
      elements.profileCount.textContent = `${totalActive}/${totalLimit}`;
      const capabilityRows = CAPABILITY_LEVELS.map((level) => {
        const profile = levelProfiles[level];
        const active = agents.filter((agent) => agent.capability_level === level).length;
        const limit = profileParallelLimits[profile] ?? profileParallelLimits[level] ?? totalLimit;
        return `<li><button class="profile-row profile-level-${escapeHtml(level)}" type="button" data-capability-level="${escapeHtml(level)}" aria-label="${escapeHtml(`${level}，${profile}：活动 execution ${active}，并发上限 ${limit}`)}" title="${escapeHtml(profile)}"><span class="profile-level-label">${escapeHtml(level)}</span><strong class="profile-capacity">${active}/${escapeHtml(limit)}</strong></button></li>`;
      }).join("");
      elements.profileList.innerHTML = capabilityRows;
    }

    function handleCapabilityAction(capabilityLevel) {
      void capabilityLevel;
    }

    function setExpandedSidePanel(button) {
      const shouldExpand = button.getAttribute("aria-expanded") !== "true";
      document.querySelectorAll(".side-heading").forEach((candidate) => {
        const content = document.querySelector(`#${candidate.getAttribute("aria-controls")}`);
        const expanded = shouldExpand && candidate === button;
        candidate.setAttribute("aria-expanded", String(expanded));
        content.hidden = false;
        content.classList.toggle("is-expanded", expanded);
        if (!expanded) window.setTimeout(() => { if (candidate.getAttribute("aria-expanded") === "false") content.hidden = true; }, 180);
      });
    }

    function listBlock(title, values, emptyText = "无") {
      const items = Array.isArray(values) ? values : [];
      return `<section class="detail-block"><h3>${escapeHtml(title)}</h3>${items.length
        ? `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
        : `<p class="muted">${escapeHtml(emptyText)}</p>`}</section>`;
    }

    function renderScopeList(values, emptyText = "无") {
      const scopes = Array.isArray(values) ? values : [];
      return scopes.length
        ? `<ul class="scope-list">${scopes.map((scope) => `<li><code>${escapeHtml(scope)}</code></li>`).join("")}</ul>`
        : `<p class="muted">${escapeHtml(emptyText)}</p>`;
    }

    function renderSplitSuggestions(suggestions) {
      const groups = Array.isArray(suggestions) ? suggestions : [];
      if (!groups.length) return "";
      return `<section class="detail-block"><h3>Planner 拆分建议</h3><p>等待 Operator 或用户决定；此处不会自动创建子任务。</p>${groups.map((group) => `
        <div class="split-suggestion"><strong>${escapeHtml(group.reason)}</strong>${(group.tasks ?? []).map((proposed) => `
          <div class="split-task"><strong>${escapeHtml(proposed.id)} · ${escapeHtml(proposed.title)} · ${escapeHtml(proposed.capability_level)}</strong>
            <span>${escapeHtml(proposed.description)}</span>
            ${renderScopeList(proposed.scope)}
            <span>依赖：${escapeHtml((proposed.depends_on ?? []).join("、") || "无")}；可并行：${escapeHtml((proposed.parallel_with ?? []).join("、") || "无")}</span>
          </div>`).join("")}</div>`).join("")}</section>`;
    }

    // 十二、详情视图。Planner 与 Operator 字段分区展示，避免把预检推断误认为用户原始需求。
    function renderPlannerSupplement(task) {
      const planner = task.planner_supplement ?? {};
      return `<section class="detail-block"><h3>Planner 预检</h3>
        <dl class="planner-meta">
          <div><dt>预检状态</dt><dd>${escapeHtml(PREFLIGHT_LABELS[planner.preflight_status] ?? planner.preflight_status ?? "--")}</dd></div>
          <div><dt>预估能力等级</dt><dd>${escapeHtml(task.estimated_capability_level ?? "--")}</dd></div>
          <div><dt>最终能力等级</dt><dd>${escapeHtml(planner.capability_level ?? "待定")}</dd></div>
          <div><dt>锁模式</dt><dd>${escapeHtml(planner.lock_mode ?? "待定")}</dd></div>
          <div><dt>预检开始</dt><dd>${escapeHtml(formatDate(planner.started_at))}</dd></div>
          <div><dt>预检完成</dt><dd>${escapeHtml(formatDate(planner.completed_at))}</dd></div>
        </dl>
        ${planner.failure ? `<p>原因：${escapeHtml(planner.failure)}</p>` : ""}
        <h4>精确 scope</h4>${renderScopeList(planner.scope, "尚未形成精确 scope")}
        <h4>技术验收补充</h4>${renderScopeList(planner.technical_acceptance, "尚无")}
        <h4>预检证据</h4>${renderScopeList(planner.evidence, "尚无")}
      </section>${renderSplitSuggestions(planner.split_suggestions)}`;
    }

    function attachmentImageUrl(taskId, path) {
      const parameters = new URLSearchParams({ task_id: taskId, path });
      return `/api/attachment?${parameters.toString()}`;
    }

    function renderAttachments(task) {
      const attachments = Array.isArray(task.attachments) ? task.attachments : [];
      if (!attachments.length) return '<section class="detail-block"><h3>附件</h3><p class="muted">无</p></section>';
      const images = attachments.filter((attachment) => {
        const extension = String(attachment.path ?? "").split(".").pop().toLowerCase();
        return IMAGE_EXTENSIONS.has(extension);
      });
      const files = attachments.filter((attachment) => !images.includes(attachment));
      const gallery = images.length ? `<ul class="attachment-gallery">${images.map((attachment) => {
        const path = String(attachment.path ?? "");
        const role = String(attachment.role ?? "source");
        const imageUrl = attachmentImageUrl(task.id, path);
        return `<li class="attachment-item">
          <a class="attachment-link" href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener" aria-label="查看附件原图：${escapeHtml(path)}">
            <img class="attachment-image" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(task.title)} · ${escapeHtml(role)}" loading="lazy">
          </a>
          <div class="attachment-meta"><span class="attachment-role">${escapeHtml(role)}</span><span class="attachment-path">${escapeHtml(path)}</span></div>
        </li>`;
      }).join("")}</ul>` : "";
      const fileList = files.length
        ? `<ul class="attachment-files">${files.map((attachment) => `<li>${escapeHtml(attachment.role)}: ${escapeHtml(attachment.path)}</li>`).join("")}</ul>`
        : "";
      return `<section class="detail-block"><h3>附件</h3>${gallery}${fileList}</section>`;
    }

    function renderResultDiagnostic(task) {
      const diagnostic = task.result?.diagnostic;
      if (!diagnostic) return "";
      const values = [
        ["类别", diagnostic.category],
        ["HTTP", diagnostic.http_status],
        ["可重试", diagnostic.retryable ? "是" : "否"],
        ["重试已耗尽", diagnostic.retry_exhausted ? "是" : "否"],
        ["结束原因", diagnostic.finish_reason],
        ["Agent 尝试", diagnostic.agent_attempt],
        ["模型步骤", diagnostic.model_step],
      ].filter(([, value]) => value !== null && value !== undefined);
      const shape = diagnostic.final_shape;
      if (shape) {
        values.push(
          ["JSON 状态", shape.json_parse_state],
          ["顶层类型", shape.top_level_type],
          ["内容长度", shape.content_length],
          ["未知字段数", shape.unknown_field_count],
        );
        const presentFields = Object.entries(shape.allowed_fields ?? {})
          .filter(([, metadata]) => metadata?.present)
          .map(([name, metadata]) => `${name}: ${metadata.type}`)
          .join("；");
        if (presentFields) values.push(["返回字段类型", presentFields]);
      }
      return `<section class="detail-block"><h3>安全诊断</h3><ul>${values.map(([label, value]) => (
        `<li><strong>${escapeHtml(label)}</strong>：${escapeHtml(value)}</li>`
      )).join("")}</ul></section>`;
    }

    function openTask(taskId) {
      const task = state?.tasks?.find((candidate) => candidate.id === taskId);
      if (!task) return;
      const projects = taskProjects(task);
      const operator = task.operator_definition ?? {};
      elements.dialogTitle.textContent = task.title;
      elements.dialogSubtitle.textContent = `${task.id} · ${STATUS_LABELS[task.status]} · revision ${state.workspace.revision}`;
      const intervention = task.human_intervention?.required
        ? `<section class="detail-block"><h3>人工介入</h3><p>${escapeHtml(task.human_intervention.question ?? "需要人工确认")}</p>${listBlock("可选方案", task.human_intervention.options)}</section>`
        : "";
      const result = task.result?.summary || task.result?.error
        ? `<section class="detail-block"><h3>结果</h3><p>${escapeHtml(task.result.summary ?? task.result.error)}</p></section>`
        : "";
      const recovery = recoveryForTask(task);
      const recoveryPanel = recovery ? `<section class="detail-block"><h3>安全恢复</h3><p>execution ${escapeHtml(recovery.execution_id)} · ${escapeHtml(recovery.execution_status)}<br>scope ${escapeHtml(recovery.scope_status)} · 活动容量已释放<br>${escapeHtml(recovery.quarantine_reason ?? recovery.termination_reason ?? "等待安全确认")}</p><div class="recovery-actions"><button class="recovery-button" type="button" data-recovery-action="requeue" data-recovery-execution="${escapeHtml(recovery.execution_id)}" data-recovery-task="${escapeHtml(task.id)}">重新排队</button><button class="recovery-button" type="button" data-recovery-action="failed" data-recovery-execution="${escapeHtml(recovery.execution_id)}" data-recovery-task="${escapeHtml(task.id)}">标记失败</button><button class="recovery-button" type="button" data-recovery-action="wait" data-recovery-execution="${escapeHtml(recovery.execution_id)}" data-recovery-task="${escapeHtml(task.id)}">继续等待</button></div></section>` : "";
      const timeline = (task.history ?? []).slice().reverse().map((entry) => `
        <li><strong>${escapeHtml(STATUS_LABELS[entry.to] ?? entry.to)}</strong> · ${escapeHtml(entry.reason)}<time>${escapeHtml(formatDate(entry.at))} · ${escapeHtml(entry.actor)}</time></li>
      `).join("");
      elements.dialogBody.innerHTML = `
        <div class="detail-grid">
          <div class="detail-field"><span class="detail-label">状态</span><span class="detail-value">${escapeHtml(STATUS_LABELS[task.status])}</span></div>
          <div class="detail-field"><span class="detail-label">预检状态</span><span class="detail-value">${escapeHtml(PREFLIGHT_LABELS[task.preflight_status] ?? task.preflight_status)}</span></div>
          <div class="detail-field"><span class="detail-label">优先级</span><span class="detail-value">${escapeHtml(PRIORITY_LABELS[task.priority] ?? task.priority)}</span></div>
          <div class="detail-field"><span class="detail-label">预估能力等级</span><span class="detail-value">${escapeHtml(task.estimated_capability_level ?? "--")}</span></div>
          <div class="detail-field"><span class="detail-label">最终能力等级</span><span class="detail-value">${escapeHtml(CAPABILITY_LABELS[task.capability_level] ?? task.capability_level ?? "待定")}</span></div>
          <div class="detail-field"><span class="detail-label">运行环境</span><span class="detail-value">${escapeHtml(runtimeEnvironmentName(task.runtime_environment))} (${escapeHtml(task.runtime_environment)})</span></div>
          <div class="detail-field"><span class="detail-label">Provider</span><span class="detail-value">${escapeHtml(task.provider_id ?? "无")}</span></div>
          <div class="detail-field"><span class="detail-label">执行配置</span><span class="detail-value">${escapeHtml(executionConfigLabel(executionConfig(task.runtime_environment, task.provider_id, task.capability_level)))}</span></div>
          <div class="detail-field"><span class="detail-label">归档时间</span><span class="detail-value">${escapeHtml(formatDate(task.archived_at))}</span></div>
          <div class="detail-field"><span class="detail-label">项目</span><span class="detail-value">${escapeHtml(projects.join("、") || "未识别")}</span></div>
          <div class="detail-field"><span class="detail-label">尝试次数</span><span class="detail-value">${escapeHtml(task.attempt)}</span></div>
          <div class="detail-field"><span class="detail-label">开始时间</span><span class="detail-value">${escapeHtml(formatDate(task.started_at))}</span></div>
          <div class="detail-field"><span class="detail-label">最后心跳</span><span class="detail-value">${escapeHtml(formatDate(task.heartbeat_at))}</span></div>
          <div class="detail-field"><span class="detail-label">执行耗时</span><span class="detail-value">${escapeHtml(formatDuration(task.started_at, task.completed_at))}</span></div>
        </div>
        <section class="detail-block"><h3>Operator 原始定义</h3><p>${escapeHtml(operator.description ?? task.description ?? "无")}</p></section>
        ${listBlock("Operator 业务验收", operator.acceptance ?? task.acceptance)}
        ${renderPlannerSupplement(task)}
        <section class="detail-block"><h3>当前进展 · ${escapeHtml(task.progress.percent)}%</h3><p>${escapeHtml(task.progress.summary || "暂无进展摘要")}</p></section>
        ${task.assigned_agent ? `<section class="detail-block"><h3>技术信息</h3><p>执行实例：${escapeHtml(task.assigned_agent)}</p></section>` : ""}
        ${listBlock("已完成", task.progress.completed)}
        ${intervention}
        ${recoveryPanel}
        ${result}
        ${renderResultDiagnostic(task)}
        ${renderPendingBlockers(task, state.tasks)}
        ${listBlock("验证记录", task.result?.verification)}
        ${renderAttachments(task)}
        <section class="detail-block"><h3>状态历史</h3><ul class="timeline">${timeline}</ul></section>
      `;
      elements.taskDialog.showModal();
    }

    // 十三、事件绑定。动态任务行、SecretStore 按钮和筛选菜单采用容器委托；
    // Escape、焦点圈和 beforeunload 分别负责可访问性、弹层隔离及停止轮询。
    elements.openSettings.addEventListener("click", () => setSettingsDrawer(true));
    elements.closeSettings.addEventListener("click", () => setSettingsDrawer(false));
    elements.settingsScrim.addEventListener("click", () => setSettingsDrawer(false));
    elements.settingsDrawer.addEventListener("click", (event) => {
      const toggle = event.target.closest("[data-toggle-secret]");
      if (toggle) {
        const input = document.getElementById(toggle.getAttribute("aria-controls"));
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.textContent = show ? "隐藏" : "显示";
        toggle.setAttribute("aria-pressed", String(show));
        input.focus();
        return;
      }
      if (event.target.closest("[data-cancel-secret-form]")) {
        clearSecretCandidateInputs();
        activeSecretForm = null;
        renderSecretProviders();
        return;
      }
      const actionButton = event.target.closest("[data-secret-action]");
      if (actionButton) runSecretAction(actionButton.dataset.providerId, actionButton.dataset.secretAction);
    });
    elements.settingsDrawer.addEventListener("submit", (event) => {
      const form = event.target.closest("form[data-secret-form]");
      if (!form) return;
      event.preventDefault();
      submitSecretForm(form);
    });
    elements.dismissNotice.addEventListener("click", hideNotice);
    elements.search.addEventListener("input", (event) => {
      currentQuery = event.target.value.trim().toLocaleLowerCase("zh-CN");
      if (state) {
        resetInvalidHeaderFilters(state.tasks);
        renderHeaderFilterButtons();
        renderTasks(state.tasks);
      }
    });
    elements.statusFilter.addEventListener("click", () => openHeaderFilter("status"));
    elements.priorityFilter.addEventListener("click", () => openHeaderFilter("priority"));
    elements.environmentFilter.addEventListener("click", () => openHeaderFilter("environment"));
    elements.projectFilter.addEventListener("click", () => openHeaderFilter("project"));
    elements.profileFilter.addEventListener("click", () => openHeaderFilter("profile"));
    elements.headerFilterMenu.addEventListener("click", (event) => {
      const option = event.target.closest(".header-filter-option");
      if (option) setHeaderFilter(option.dataset.headerFilterKind, option.dataset.headerFilterValue);
    });
    elements.headerFilterMenu.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeHeaderFilterMenu({ restoreFocus: true });
      }
    });
    document.addEventListener("pointerdown", (event) => {
      if (activeHeaderFilter && !elements.headerFilterMenu.contains(event.target) && !event.target.closest(".header-filter-button")) closeHeaderFilterMenu();
    });
    document.addEventListener("keydown", (event) => {
      trapSettingsFocus(event);
      if (event.key === "Escape" && elements.settingsDrawer.classList.contains("is-open")) {
        event.preventDefault();
        setSettingsDrawer(false);
      }
    });
    window.addEventListener("resize", () => {
      if (activeHeaderFilter) renderHeaderFilterMenu();
    });
    elements.taskTable.addEventListener("scroll", () => {
      if (activeHeaderFilter) renderHeaderFilterMenu();
    });
    // 切换顶部一级状态分类时清空所有表头筛选，防止旧分类的隐藏条件造成空列表。
    function resetHeaderFilters() {
      currentStatus = "all";
      currentPriority = "all";
      currentEnvironment = "all";
      currentProject = "all";
      currentProfile = "all";
      closeHeaderFilterMenu();
      renderHeaderFilterButtons();
    }

    function setTaskFilter(filter) {
      const nextFilter = ["draft", "review", "pending", "active", "closed", "archived"].includes(filter) ? filter : "pending";
      if (nextFilter !== currentFilter) resetHeaderFilters();
      currentFilter = nextFilter;
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
      });
      if (state) {
        resetInvalidHeaderFilters(state.tasks);
        renderHeaderFilterButtons();
        renderTasks(state.tasks);
      }
    }

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => setTaskFilter(button.dataset.filter));
    });
    elements.taskRows.addEventListener("click", (event) => {
      const copyButton = event.target.closest(".task-copy-button");
      if (copyButton) {
        event.stopPropagation();
        copyTaskId(copyButton.dataset.copyTaskId, copyButton);
        return;
      }
      const archiveButton = event.target.closest(".archive-button");
      if (archiveButton) {
        event.stopPropagation();
        archiveTask(archiveButton.dataset.archiveTaskId);
        return;
      }
      const recoveryButton = event.target.closest("[data-open-recovery-task]");
      if (recoveryButton) {
        event.stopPropagation();
        openTask(recoveryButton.dataset.openRecoveryTask);
        return;
      }
      if (event.target.closest(".conflict-summary, .queue-summary")) return;
      const row = event.target.closest("tr[data-task-id]");
      if (row) openTask(row.dataset.taskId);
    });
    elements.taskRows.addEventListener("keydown", (event) => {
      if (event.target.closest(".task-copy-button, .archive-button, .recovery-button")) return;
      if (event.target.closest(".conflict-summary, .queue-summary")) return;
      if (!["Enter", " "].includes(event.key)) return;
      const row = event.target.closest("tr[data-task-id]");
      if (!row) return;
      event.preventDefault();
      openTask(row.dataset.taskId);
    });
    document.querySelector(".side-section").addEventListener("click", (event) => {
      const heading = event.target.closest(".side-heading");
      if (heading) setExpandedSidePanel(heading);
    });
    elements.profileList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-capability-level]");
      if (!button) return;
      handleCapabilityAction(button.dataset.capabilityLevel);
    });
    elements.closeDialog.addEventListener("click", () => elements.taskDialog.close());
    elements.dialogBody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-recovery-action]");
      if (!button) return;
      recoverTask(button.dataset.recoveryTask, button.dataset.recoveryExecution, button.dataset.recoveryAction);
    });
    elements.taskDialog.addEventListener("click", (event) => {
      if (event.target === elements.taskDialog) elements.taskDialog.close();
    });
    window.addEventListener("beforeunload", stopPolling);

    // 十四、启动：首次请求无论成功与否都启动轮询，使服务恢复后页面可自动恢复。
    refreshState().finally(startPolling);
  </script>
</body>
</html>
