<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Local Agent Loop 运行日志</title>
  <link rel="stylesheet" href="/runtime-logs.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="返回任务面板">LA</a>
    <div>
      <p class="eyebrow">Local Agent Loop</p>
      <h1>运行日志</h1>
    </div>
    <a class="dashboard-link" href="/">任务面板</a>
  </header>
  <main>
    <section class="overview" aria-labelledby="logs-title">
      <div>
        <p class="eyebrow">本机运行记录</p>
        <h2 id="logs-title">调度与队列日志</h2>
      </div>
      <p id="updated-at" class="updated-at" aria-live="polite">正在读取日志</p>
    </section>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <nav id="log-tabs" class="log-tabs" aria-label="运行日志分类">
      <button type="button" data-source="planner">Planner</button>
      <button type="button" data-source="dispatcher">Dispatcher</button>
      <button type="button" data-source="runner">Runner</button>
    </nav>
    <section class="log-panel" aria-live="polite">
      <div class="log-panel-header">
        <div>
          <h2 id="source-title">Planner</h2>
          <p id="source-meta"></p>
        </div>
        <span id="entry-count" class="entry-count"></span>
      </div>
      <div id="entries" class="entries"></div>
    </section>
  </main>
  <script src="/runtime-logs.js"></script>
</body>
</html>
