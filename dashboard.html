<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Local Agent Loop</title>
  <style>
    :root {
      --canvas: #f3f5f7;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --ink: #18212b;
      --muted: #66727f;
      --line: #dce2e8;
      --line-strong: #c8d0d8;
      --accent: #087f8c;
      --accent-soft: #e7f4f5;
      --success: #137a4a;
      --success-soft: #e8f5ee;
      --warning: #9a5b00;
      --warning-soft: #fff3d9;
      --danger: #b42318;
      --danger-soft: #fdecea;
      --human: #7c3b83;
      --human-soft: #f5eaf6;
      --neutral-soft: #edf1f4;
      --shadow: 0 8px 24px rgba(24, 33, 43, 0.12);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body { height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--canvas);
    }

    button, input { font: inherit; }

    button { letter-spacing: 0; }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(8, 127, 140, 0.25);
      outline-offset: 2px;
    }

    .app-header {
      flex: 0 0 auto;
      min-height: 78px;
      display: grid;
      grid-template-columns: minmax(230px, auto) minmax(420px, 1fr) auto;
      grid-template-areas: "brand status actions";
      align-items: center;
      gap: 18px;
      padding: 10px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      grid-area: brand;
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .header-status {
      grid-area: status;
      min-width: 0;
    }

    .header-actions {
      grid-area: actions;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .connection-meta {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #98a2ad;
    }

    .connection[data-state="live"] .connection-dot { background: var(--success); }
    .connection[data-state="error"] .connection-dot { background: var(--danger); }
    .connection[data-state="snapshot"] .connection-dot { background: var(--warning); }

    .workspace-updated {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .primary-button,
    .secondary-button {
      min-height: 38px;
      border-radius: 6px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .primary-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .primary-button:hover { background: #066d78; }

    .settings-button {
      display: inline-grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .settings-button:hover,
    .settings-button:focus-visible { background: var(--surface-subtle); }

    .settings-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .secondary-button {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
    }

    .secondary-button:hover { background: var(--surface-subtle); }

    .main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 16px 28px;
    }

    .notice {
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 11px 14px;
      border: 1px solid #e7c985;
      border-radius: 6px;
      background: var(--warning-soft);
      color: #654100;
      font-size: 13px;
      line-height: 1.5;
    }

    .notice.is-visible { display: flex; }

    .notice button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-weight: 800;
    }

    .summary-band {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .metric {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      min-height: 42px;
      padding: 7px 10px;
      border-right: 1px solid var(--line);
    }

    .metric:last-child { border-right: 0; }

    .metric-filter {
      width: 100%;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .metric-filter:hover,
    .metric-filter:focus-visible,
    .metric-filter[aria-pressed="true"] {
      background: var(--accent-soft);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .metric-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .metric-value {
      display: block;
      margin-top: 4px;
      font-size: 19px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: 0;
    }

    .metric-value.success { color: var(--success); }
    .metric-value.warning { color: var(--warning); }
    .metric-value.danger { color: var(--danger); }

    .distribution {
      margin-top: 6px;
      height: 6px;
      display: flex;
      overflow: hidden;
      border-radius: 3px;
      background: var(--neutral-soft);
    }

    .distribution span { min-width: 0; transition: width 180ms ease; }
    .distribution .done { background: var(--success); }
    .distribution .active { background: var(--accent); }
    .distribution .attention { background: var(--warning); }
    .distribution .failed { background: var(--danger); }
    .distribution .queued { background: #98a2ad; }

    .content-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.26fr);
      gap: 16px;
      align-items: stretch;
    }

    .task-section,
    .side-section {
      min-width: 0;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .section-header {
      min-height: 58px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
    }

    .section-header h2,
    .side-block .side-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .view-count,
    .archive-time {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0;
    }

    .task-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 10px;
      width: 100%;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }

    .search-input {
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--ink);
      background: var(--surface);
    }

    .search-input {
      flex: 1 1 180px;
      width: 220px;
      min-width: 140px;
      max-width: 220px;
    }

    .segments {
      display: flex;
      flex: 0 0 auto;
      gap: 2px;
      min-width: max-content;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-subtle);
      white-space: nowrap;
    }

    .segments button {
      flex: 0 0 54px;
      width: 54px;
      min-height: 28px;
      border: 0;
      border-radius: 4px;
      padding: 4px 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 650;
    }

    .segments button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(24, 33, 43, 0.12);
    }

    .search-input,
    .segments button,
    .header-filter-button,
    .header-filter-option {
      font-family: inherit;
      font-size: 12px;
      font-weight: 650;
      line-height: normal;
    }

    .task-section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 38px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface-subtle);
      font-size: 11px;
      font-weight: 700;
      text-align: left;
    }

    .table-header-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
    }

    .header-filter-button {
      display: inline-grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .header-filter-button::before {
      width: 12px;
      height: 10px;
      background: currentColor;
      clip-path: polygon(0 0, 100% 0, 64% 45%, 64% 100%, 36% 100%, 36% 45%);
      content: "";
    }

    .header-filter-button:hover,
    .header-filter-button:focus-visible,
    .header-filter-button.is-active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .header-filter-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .header-filter-menu {
      position: fixed;
      z-index: 20;
      display: grid;
      gap: 3px;
      width: max-content;
      min-width: 166px;
      max-width: min(280px, calc(100vw - 24px));
      max-height: min(320px, calc(100vh - 24px));
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 5px;
      background: var(--surface);
      box-shadow: 0 8px 20px rgba(24, 33, 43, 0.18);
    }

    .header-filter-option {
      width: 100%;
      min-height: 30px;
      border: 0;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }

    .header-filter-option:hover,
    .header-filter-option:focus-visible,
    .header-filter-option[aria-checked="true"] { background: var(--accent-soft); color: var(--accent); }
    .header-filter-option:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      font-size: 13px;
    }

    .task-time-info {
      display: grid;
      gap: 4px;
      min-width: 0;
      font-size: 11px;
      line-height: 1.25;
    }

    .task-time-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: baseline;
      gap: 5px;
      min-width: 0;
    }

    .task-time-label { color: var(--muted); font-size: 10px; }
    .task-time-value { min-width: 0; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .task-time-value.is-placeholder { color: var(--muted); font-weight: 500; }

    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f7fbfb; }
    tbody tr:last-child td { border-bottom: 0; }

    .task-cell { min-width: 0; }

    .task-title-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .task-title {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-weight: 700;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-copy-button {
      position: relative;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .task-copy-button:hover { color: var(--accent); background: var(--accent-soft); }
    .task-copy-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .task-copy-button:active { color: #075f68; background: #cceff0; transform: translateY(1px); }
    .task-copy-button[data-copy-state="success"] { color: var(--success); background: var(--success-soft); }
    .task-copy-button[data-copy-state="failed"] { color: var(--danger); background: var(--danger-soft); }
    .copy-icon { font-size: 17px; line-height: 1; }

    .task-action-heading,
    .task-action-cell { text-align: center; }

    .archive-button {
      display: inline-flex;
      width: 62px;
      height: 32px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      padding: 0 7px;
      color: var(--accent);
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .archive-button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .archive-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .archive-button:disabled { cursor: wait; opacity: 0.58; }
    .archive-button.is-submitting .archive-icon { animation: archive-submit 0.8s linear infinite; }
    .archive-icon { font-size: 15px; line-height: 1; }
    @keyframes archive-submit { to { transform: rotate(360deg); } }
    .copy-feedback {
      position: absolute;
      z-index: 2;
      top: -29px;
      left: 50%;
      min-width: max-content;
      transform: translateX(-50%);
      border-radius: 4px;
      padding: 3px 6px;
      color: #fff;
      background: #26333d;
      box-shadow: 0 2px 6px rgba(24, 33, 43, 0.18);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }
    .task-copy-button[data-copy-state] .copy-feedback { opacity: 1; }

    .task-id {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 11px;
    }

    .status-badge,
    .priority-badge {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      min-height: 24px;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 760;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-draft, .status-pending, .status-claimed { background: var(--neutral-soft); color: #46515c; }
    .status-running { background: var(--accent-soft); color: #056a74; }
    .status-waiting-human { background: var(--human-soft); color: var(--human); }
    .status-waiting-conflict, .status-blocked, .status-stalled { background: var(--warning-soft); color: var(--warning); }
    .status-succeeded { background: var(--success-soft); color: var(--success); }
    .status-confirmed { background: #d9f0e4; color: #0d633c; }
    .status-failed { background: var(--danger-soft); color: var(--danger); }
    .status-cancelled { background: var(--neutral-soft); color: var(--muted); }

    .status-cell {
      position: relative;
      min-width: 0;
    }

    .status-stack {
      display: grid;
      justify-items: start;
      min-width: 0;
      gap: 5px;
    }

    .status-badge-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .dependency-indicator {
      flex: 0 0 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dependency-indicator.is-red { background: var(--danger); }
    .dependency-indicator.is-yellow { background: var(--warning); }
    .dependency-indicator.is-green { background: var(--success); }

    .conflict-summary {
      position: relative;
      width: min(180px, 100%);
      min-width: 0;
      color: var(--warning);
      font-size: 10px;
    }

    .conflict-summary summary {
      display: block;
      min-width: 0;
      overflow: hidden;
      cursor: pointer;
      font-weight: 700;
      line-height: 1.4;
      list-style: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conflict-summary summary::-webkit-details-marker { display: none; }
    .conflict-summary summary:focus-visible { outline: 2px solid var(--warning); outline-offset: 2px; }

    .conflict-popover {
      position: absolute;
      z-index: 20;
      top: calc(100% + 5px);
      left: 0;
      display: none;
      width: min(390px, calc(100vw - 48px));
      max-height: 320px;
      overflow: auto;
      border: 1px solid #d9bc8a;
      border-radius: 6px;
      padding: 10px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.16);
      color: var(--ink);
    }

    .conflict-summary[open] .conflict-popover,
    .conflict-summary:hover .conflict-popover,
    .conflict-summary:focus-within .conflict-popover { display: grid; gap: 10px; }

    .conflict-group {
      display: grid;
      min-width: 0;
      gap: 4px;
    }

    .conflict-group + .conflict-group {
      border-top: 1px solid var(--line);
      padding-top: 9px;
    }

    .conflict-task-title { color: var(--ink); font-size: 12px; line-height: 1.4; }

    .conflict-task-id,
    .conflict-scope {
      display: block;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 10px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conflict-scopes {
      display: grid;
      gap: 4px;
      margin: 2px 0 0;
      padding: 0;
      list-style: none;
    }

    .conflict-scopes li { display: grid; min-width: 0; gap: 1px; }
    .conflict-detected { color: var(--muted); font-size: 10px; line-height: 1.4; }

    .conflict-detail-list {
      display: grid;
      gap: 12px;
    }

    .priority-critical { background: var(--danger-soft); color: var(--danger); }
    .priority-blocker { background: #7f1d1d; color: #fff; }
    .priority-high { background: var(--warning-soft); color: var(--warning); }
    .priority-medium { background: var(--accent-soft); color: #056a74; }
    .priority-low { background: var(--neutral-soft); color: var(--muted); }

    .profile-badge,
    .environment-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 7px;
      background: var(--surface-subtle);
      color: #3f4c58;
      font-size: 10px;
      font-weight: 730;
      line-height: 1.2;
      white-space: nowrap;
    }
    .profile-L1 { border-color: #cad8ce; background: #eff6f1; color: #315d3d; }
    .profile-L2 { border-color: #c9d9dc; background: #f2f8f8; color: #315c62; }
    .profile-L3 { border-color: #d7cfaa; background: #f8f5e8; color: #66591b; }
    .profile-L4 { border-color: #d2c4da; background: #f5eff7; color: #654773; }
    .profile-L5 { border-color: #ddc4c4; background: #faeeee; color: #7c3030; }
    .environment-badge { border-color: #c7d0d9; background: #f3f5f7; color: #364553; }

    .project-cell {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      min-width: 0;
      gap: 4px;
    }

    .project-badge {
      display: inline-block;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid #c9d9dc;
      border-radius: 4px;
      padding: 3px 6px;
      background: #f2f8f8;
      color: #315c62;
      font-family: Consolas, monospace;
      font-size: 10px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .muted { color: var(--muted); }

    .empty-state {
      display: grid;
      flex: 1 1 auto;
      min-height: 0;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 15px;
    }

    .side-section {
      overflow: auto;
      scrollbar-gutter: stable;
    }

    .side-block + .side-block { border-top: 1px solid var(--line); }

    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      border: 0;
      padding: 14px 16px;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
    }

    .side-heading-group {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 8px;
    }

    .profile-level-help-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .profile-level-help {
      display: inline-grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      background: var(--surface-subtle);
      cursor: help;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      outline: 0;
    }

    .profile-level-help:focus-visible {
      color: var(--accent);
      border-color: var(--accent);
      outline: 2px solid var(--accent-soft);
      outline-offset: 1px;
    }

    .profile-level-tooltip {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 30;
      display: grid;
      width: max-content;
      max-width: min(280px, calc(100vw - 32px));
      gap: 7px;
      padding: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 8px 20px rgba(24, 33, 43, 0.16);
      font-size: 10px;
      line-height: 1.3;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .profile-level-help-wrap:hover .profile-level-tooltip,
    .profile-level-help:focus-visible + .profile-level-tooltip {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .profile-level-tooltip-item {
      display: grid;
      gap: 2px;
      min-width: 190px;
    }

    .profile-level-tooltip-item strong { color: var(--ink); font-size: 11px; }
    .profile-level-tooltip-item span { color: var(--muted); white-space: nowrap; }

    .side-heading-summary {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-heading::after {
      flex: 0 0 auto;
    }

    .side-heading:hover { background: var(--surface-subtle); }
    .side-heading:focus-visible { outline-offset: -3px; }

    .side-heading::after {
      width: 8px;
      height: 8px;
      margin-left: 4px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      content: "";
      transform: rotate(45deg) translateY(-2px);
      transition: transform 160ms ease;
    }

    .side-heading[aria-expanded="true"]::after { transform: rotate(225deg) translateY(-2px); }

    .side-content {
      overflow: hidden;
      max-height: 0;
      padding: 0 16px;
      opacity: 0;
      transition: max-height 180ms ease, padding 180ms ease, opacity 140ms ease;
    }

    .side-content.is-expanded {
      max-height: 900px;
      padding: 0 16px 16px;
      opacity: 1;
    }

    .profile-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .profile-row {
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      border-left: 4px solid var(--line);
      color: #24313b;
    }

    .profile-row.profile-level-L1 { border-left-color: #68a873; }
    .profile-row.profile-level-L2 { border-left-color: #9cba55; }
    .profile-row.profile-level-L3 { border-left-color: #d0aa35; }
    .profile-row.profile-level-L4 { border-left-color: #d98239; }
    .profile-row.profile-level-L5 { border-left-color: #b94b4b; }

    .profile-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding-left: 10px;
    }

    .profile-codex-label {
      color: #24313b;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.15;
    }

    .profile-limit {
      color: var(--muted);
      flex: 0 0 auto;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .profile-channels {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      min-width: 0;
      padding-left: 10px;
    }

    .profile-channel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 7px;
      row-gap: 2px;
      min-width: 0;
      padding: 5px 0;
      border-top: 1px solid #e6e9ed;
    }

    .profile-channel-name {
      min-width: 0;
      color: #364553;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
    }

    .profile-channel-active {
      color: var(--ink);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 760;
      line-height: 1.25;
    }

    /* The profile matrix is intentionally visual-only: twelve channel tiles in two columns. */
    #profileContent {
      display: block;
    }

    #profileList {
      grid-template-columns: minmax(0, 1fr);
      gap: 4px;
    }

    #profileList > .profile-row,
    .profile-channels {
      display: contents;
    }

    .profile-heading-row {
      display: none;
    }

    .profile-channel {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 30px;
      min-width: 0;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      overflow: hidden;
      color: transparent;
      font-size: 0;
      line-height: 0;
      text-align: left;
    }

    .profile-channel-active {
      display: none;
    }

    .profile-channel-active {
      display: block;
      flex: 0 0 auto;
      margin-left: auto;
    }

    .profile-channel-name { color: #24313b; }

    .profile-level-L1 .profile-channel { background: #c3e5c9; }
    .profile-level-L2 .profile-channel { background: #d9e9ad; }
    .profile-level-L3 .profile-channel { background: #f0dfa1; }
    .profile-level-L4 .profile-channel { background: #f5c999; }
    .profile-level-L5 .profile-channel { background: #e8a4a4; }

    .agent-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #98a2ad;
    }

    .agent-dot.running { background: var(--accent); }
    .agent-dot.idle { background: var(--success); }
    .agent-dot.failed { background: var(--danger); }
    .agent-dot.waiting { background: var(--warning); }

    .agent-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-role { color: var(--muted); font-size: 11px; }

    .detail-dialog {
      width: min(680px, calc(100vw - 32px));
      max-height: min(780px, calc(100vh - 32px));
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
      color: var(--ink);
    }

    .detail-dialog::backdrop { background: rgba(24, 33, 43, 0.48); }

    .settings-scrim {
      position: fixed;
      z-index: 30;
      inset: 0;
      border: 0;
      background: rgba(24, 33, 43, 0.48);
      cursor: default;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .settings-drawer {
      position: fixed;
      z-index: 31;
      top: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      width: min(440px, 100vw);
      height: 100dvh;
      border-left: 1px solid var(--line-strong);
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateX(100%);
      transition: transform 180ms ease;
      visibility: hidden;
    }

    .settings-drawer.is-open { transform: translateX(0); visibility: visible; }
    .settings-scrim.is-visible { opacity: 1; pointer-events: auto; }

    .settings-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .settings-drawer-header h2 { margin: 0; font-size: 16px; letter-spacing: 0; }
    .settings-drawer-body { flex: 1 1 auto; min-height: 0; }

    .dialog-header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .dialog-header h2 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .dialog-header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

    .icon-button {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .dialog-body { padding: 20px; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-field {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-subtle);
    }

    .detail-label { display: block; color: var(--muted); font-size: 10px; }
    .detail-value { display: block; margin-top: 5px; overflow-wrap: anywhere; font-size: 12px; font-weight: 700; }

    .detail-block + .detail-block { margin-top: 20px; }
    .detail-block h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0; }
    .detail-block p { margin: 0; color: #44505c; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .detail-block ul { margin: 0; padding-left: 18px; color: #44505c; font-size: 12px; line-height: 1.7; }

    .attachment-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0 !important;
      list-style: none;
    }

    .attachment-item {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-subtle);
    }

    .attachment-link {
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 10;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .attachment-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .attachment-meta {
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      line-height: 1.4;
    }

    .attachment-role { color: var(--ink); font-size: 11px; font-weight: 700; }
    .attachment-path { overflow-wrap: anywhere; color: var(--muted); font-size: 10px; }
    .attachment-files { margin-top: 10px !important; }

    .timeline { margin: 0; padding: 0; list-style: none; }
    .timeline li { position: relative; padding: 0 0 14px 19px; font-size: 12px; line-height: 1.45; }
    .timeline li::before { content: ""; position: absolute; top: 5px; left: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .timeline li::after { content: ""; position: absolute; top: 13px; bottom: 0; left: 5px; width: 1px; background: var(--line-strong); }
    .timeline li:last-child::after { display: none; }
    .timeline time { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

    @media (max-width: 1180px) {
      .app-header {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "brand actions"
          "status status";
      }
    }

    @media (max-width: 1080px) {
      body {
        min-height: 100vh;
        overflow: auto;
        display: block;
      }
      .main { display: block; }
      .summary-band { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric:nth-child(3) { border-right: 0; }
      .metric:nth-child(-n + 3) { border-bottom: 1px solid var(--line); }
      .content-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
      .task-section { display: block; overflow: hidden; }
      .table-wrap { min-height: auto; overflow-x: auto; overflow-y: visible; }
      .empty-state { min-height: 280px; }
      .side-section { display: block; overflow: visible; }
      .side-block + .side-block { border-top: 1px solid var(--line); border-left: 0; }
      .profile-channels { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 760px) {
      body { overflow-x: hidden; }
      .app-header {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "brand"
          "status"
          "actions";
        align-items: stretch;
        padding: 14px 16px;
      }
      .header-actions { width: 100%; justify-content: space-between; }
      .connection-label { overflow: hidden; text-overflow: ellipsis; }
      .connection-meta { overflow: hidden; }
      .main { padding: 16px 12px 28px; }
      .summary-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { min-height: 44px; border-bottom: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:nth-last-child(-n + 2) { border-bottom: 0; }
      .metric:nth-child(3) { border-right: 1px solid var(--line); }
      .section-header { grid-template-columns: minmax(0, 1fr); align-items: stretch; padding: 12px; }
      .task-section { overflow: hidden; }
      .task-tools { justify-content: flex-start; padding-bottom: 4px; scrollbar-width: thin; }
      .search-input { flex: 0 0 180px; width: 180px; }
      .table-wrap { width: 100%; overflow: visible; }
      table, thead, tbody { display: block; width: 100%; min-width: 0; }
      table { table-layout: auto; }
      thead { display: none; }
      tbody tr { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; padding: 13px; border-bottom: 1px solid var(--line); }
      tbody tr:last-child { border-bottom: 0; }
      td { display: grid; align-content: start; justify-items: start; gap: 4px; width: auto; max-width: 100%; min-width: 0; min-height: 42px; overflow: hidden; padding: 0; border: 0; }
      td::before { content: attr(data-label); color: var(--muted); font-size: 10px; line-height: 1.2; }
      td:first-child { grid-column: 1 / -1; display: block; min-height: 0; padding-bottom: 5px; }
      td:first-child::before { display: none; }
      td > * { min-width: 0; max-width: 100%; }
      .task-title { white-space: normal; }
      .task-title-line { width: 100%; align-items: start; }
      .status-cell { overflow: visible; }
      .status-stack { width: 100%; justify-items: start; }
      .conflict-summary { width: min(240px, 100%); }
      .task-time-info { width: 100%; }
      .task-time-row { grid-template-columns: 30px minmax(0, 1fr); }
      .conflict-popover { right: auto; left: 0; }
      .project-cell { width: 100%; align-items: flex-start; }
      td.task-action-cell { align-content: center; justify-items: start; }
      td.task-action-cell:empty { min-height: 0; }
      td.task-action-cell:empty::before { display: none; }
      .side-section { grid-template-columns: minmax(0, 1fr); }
      .side-block + .side-block { border-top: 1px solid var(--line); border-left: 0; }
      .profile-row { padding-block: 10px; }
      .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 420px) {
      .brand p { display: none; }
      .header-actions { align-items: stretch; flex-direction: column; }
      .primary-button { width: 100%; }
      .detail-grid { grid-template-columns: minmax(0, 1fr); }
      .profile-heading-row { align-items: flex-start; flex-direction: column; gap: 3px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">LA</div>
      <div>
        <h1>Local Agent Loop</h1>
        <p>本地任务运行状态</p>
      </div>
    </div>
    <div class="header-status">
      <section class="summary-band" aria-label="任务总览">
        <div class="metric"><div class="metric-label">当前任务</div><div id="metricTotal" class="metric-value">0</div></div>
        <button class="metric metric-filter" type="button" data-filter="pending" aria-pressed="false"><span class="metric-label">待执行</span><span id="metricPending" class="metric-value">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="active" aria-pressed="false"><span class="metric-label">执行中</span><span id="metricRunning" class="metric-value">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="attention" aria-pressed="false"><span class="metric-label">需要关注</span><span id="metricAttention" class="metric-value warning">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="closed" aria-pressed="false"><span class="metric-label">待确认</span><span id="metricConfirmation" class="metric-value success">0</span></button>
        <button class="metric metric-filter" type="button" data-filter="archived" aria-pressed="false"><span class="metric-label">已归档</span><span id="metricArchived" class="metric-value success">0</span></button>
      </section>
      <div id="distribution" class="distribution" aria-label="任务状态分布">
        <span class="done" style="width: 0"></span>
        <span class="active" style="width: 0"></span>
        <span class="attention" style="width: 0"></span>
        <span class="failed" style="width: 0"></span>
        <span class="queued" style="width: 100%"></span>
      </div>
    </div>
    <div class="header-actions">
      <div class="connection-meta">
        <div id="connection" class="connection" data-state="idle" role="status" aria-live="polite">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionLabel" class="connection-label">正在连接数据库服务</span>
        </div>
        <span id="workspaceUpdated" class="workspace-updated">--</span>
      </div>
      <button id="openSettings" class="settings-button" type="button" aria-label="设置" aria-expanded="false" aria-controls="settingsDrawer" title="设置">&#9881;</button>
    </div>
  </header>

  <main class="main">
    <div id="notice" class="notice" role="alert">
      <span id="noticeText"></span>
      <button id="dismissNotice" type="button" aria-label="关闭提示" title="关闭">×</button>
    </div>

    <div class="content-grid">
      <section class="task-section">
        <div class="section-header">
          <div class="section-title"><h2>任务</h2><span id="taskViewCount" class="view-count">当前 0 项</span></div>
          <div class="task-tools">
            <input id="search" class="search-input" type="search" placeholder="搜索 ID、标题或项目" aria-label="搜索任务">
            <div class="segments" aria-label="任务筛选">
              <button type="button" data-filter="pending" aria-pressed="true">待执行</button>
              <button type="button" data-filter="active" aria-pressed="false">执行中</button>
              <button type="button" data-filter="attention" aria-pressed="false">需关注</button>
              <button type="button" data-filter="closed" aria-pressed="false">已结束</button>
              <button type="button" data-filter="archived" aria-pressed="false">已归档</button>
            </div>
          </div>
        </div>
        <div id="taskTable" class="table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th style="width: 19%">任务</th>
                <th style="width: 11%"><span class="table-header-label">状态 <button id="statusFilter" class="header-filter-button" type="button" aria-label="筛选状态" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选状态"></button></span></th>
                <th style="width: 8%"><span class="table-header-label">优先级 <button id="priorityFilter" class="header-filter-button" type="button" aria-label="筛选优先级" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选优先级"></button></span></th>
                <th style="width: 10%"><span class="table-header-label">能力等级 <button id="profileFilter" class="header-filter-button" type="button" aria-label="筛选能力等级" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选能力等级"></button></span></th>
                <th style="width: 15%"><span class="table-header-label">运行环境 <button id="environmentFilter" class="header-filter-button" type="button" aria-label="筛选运行环境" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选运行环境"></button></span></th>
                <th style="width: 15%"><span class="table-header-label">项目 <button id="projectFilter" class="header-filter-button" type="button" aria-label="筛选项目" aria-expanded="false" aria-controls="headerFilterMenu" title="筛选项目"></button></span></th>
                <th style="width: 15%">时间</th>
                <th class="task-action-heading" style="width: 7%">操作</th>
              </tr>
            </thead>
            <tbody id="taskRows"></tbody>
          </table>
        </div>
        <div id="taskEmpty" class="empty-state">
          <div><strong>正在载入任务</strong><span>等待 SQLite 状态服务响应</span></div>
        </div>
        <div id="headerFilterMenu" class="header-filter-menu" role="menu" hidden></div>
      </section>

      <aside class="side-section" aria-label="运行详情">
        <section class="side-block">
          <button class="side-heading" type="button" aria-expanded="true" aria-controls="profileContent"><span class="side-heading-group"><span class="side-title" role="heading" aria-level="2">调度容量</span><span class="profile-level-help-wrap"><span id="profileLevelHelp" class="profile-level-help" tabindex="0" role="img" aria-label="查看 L1 至 L5 执行配置">!</span><span id="profileLevelTooltip" class="profile-level-tooltip" role="tooltip"></span></span><span id="profileCount" class="side-heading-summary">0/8</span></span></button>
          <div id="profileContent" class="side-content is-expanded"><ul id="profileList" class="profile-list"><li class="muted">暂无任务</li></ul></div>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="taskDialog" class="detail-dialog">
    <div class="dialog-header">
      <div><h2 id="dialogTitle"></h2><p id="dialogSubtitle"></p></div>
      <button id="closeDialog" class="icon-button" type="button" aria-label="关闭任务详情" title="关闭">×</button>
    </div>
    <div id="dialogBody" class="dialog-body"></div>
  </dialog>

  <button id="settingsScrim" class="settings-scrim" type="button" aria-label="关闭设置" aria-hidden="true" tabindex="-1"></button>
  <aside id="settingsDrawer" class="settings-drawer" aria-hidden="true" aria-labelledby="settingsDrawerTitle">
    <div class="settings-drawer-header">
      <h2 id="settingsDrawerTitle">设置</h2>
      <button id="closeSettings" class="icon-button" type="button" aria-label="关闭设置" title="关闭">×</button>
    </div>
    <div class="settings-drawer-body"></div>
  </aside>

  <script>
    "use strict";

    const STATUS_LABELS = {
      DRAFT: "草稿",
      PENDING: "待执行",
      CLAIMED: "已领取",
      RUNNING: "执行中",
      WAITING_CONFLICT: "等待冲突",
      WAITING_HUMAN: "等待人工",
      BLOCKED: "已阻塞",
      STALLED: "已卡顿",
      SUCCEEDED: "已完成",
      CONFIRMED: "已确认",
      FAILED: "失败",
      CANCELLED: "已取消"
    };
    const PRIORITY_LABELS = { blocker: "阻断", critical: "紧急", high: "高", medium: "中", low: "低" };
    const CAPABILITY_LEVELS = ["L1", "L2", "L3", "L4", "L5"];
    const CAPABILITY_LABELS = Object.fromEntries(CAPABILITY_LEVELS.map((level) => [level, level]));
    const ACTIVE_STATUSES = new Set(["CLAIMED", "RUNNING"]);
    const ATTENTION_STATUSES = new Set(["DRAFT", "WAITING_CONFLICT", "WAITING_HUMAN", "BLOCKED", "STALLED", "FAILED"]);
    const CLOSED_STATUSES = new Set(["SUCCEEDED", "CONFIRMED", "FAILED", "CANCELLED"]);
    const PRIORITY_ORDER = { blocker: 0, critical: 1, high: 2, medium: 3, low: 4 };
    const VALID_STATUSES = new Set(Object.keys(STATUS_LABELS));
    const HEADER_FILTER_STATUSES = ["DRAFT", "PENDING", "RUNNING", "WAITING_CONFLICT", "WAITING_HUMAN", "SUCCEEDED", "CONFIRMED", "FAILED", "CANCELLED"];
    const HEADER_FILTER_PRIORITIES = ["blocker", "critical", "high", "medium", "low"];
    const TASK_SCHEMA_VERSION = "3.4.0";
    const STATE_ENDPOINT = "/api/state";
    const TASK_ACTION_ENDPOINT = "/api/task-action";
    const IMAGE_EXTENSIONS = new Set(["avif", "gif", "jpeg", "jpg", "png", "webp"]);

    const elements = {
      connection: document.querySelector("#connection"),
      connectionLabel: document.querySelector("#connectionLabel"),
      openSettings: document.querySelector("#openSettings"),
      closeSettings: document.querySelector("#closeSettings"),
      settingsDrawer: document.querySelector("#settingsDrawer"),
      settingsScrim: document.querySelector("#settingsScrim"),
      notice: document.querySelector("#notice"),
      noticeText: document.querySelector("#noticeText"),
      dismissNotice: document.querySelector("#dismissNotice"),
      search: document.querySelector("#search"),
      statusFilter: document.querySelector("#statusFilter"),
      priorityFilter: document.querySelector("#priorityFilter"),
      environmentFilter: document.querySelector("#environmentFilter"),
      projectFilter: document.querySelector("#projectFilter"),
      profileFilter: document.querySelector("#profileFilter"),
      headerFilterMenu: document.querySelector("#headerFilterMenu"),
      taskTable: document.querySelector("#taskTable"),
      taskEmpty: document.querySelector("#taskEmpty"),
      taskRows: document.querySelector("#taskRows"),
      taskViewCount: document.querySelector("#taskViewCount"),
      metricTotal: document.querySelector("#metricTotal"),
      metricPending: document.querySelector("#metricPending"),
      metricRunning: document.querySelector("#metricRunning"),
      metricAttention: document.querySelector("#metricAttention"),
      metricConfirmation: document.querySelector("#metricConfirmation"),
      metricArchived: document.querySelector("#metricArchived"),
      distribution: document.querySelector("#distribution"),
      workspaceUpdated: document.querySelector("#workspaceUpdated"),
      profileList: document.querySelector("#profileList"),
      profileCount: document.querySelector("#profileCount"),
      profileLevelTooltip: document.querySelector("#profileLevelTooltip"),
      taskDialog: document.querySelector("#taskDialog"),
      dialogTitle: document.querySelector("#dialogTitle"),
      dialogSubtitle: document.querySelector("#dialogSubtitle"),
      dialogBody: document.querySelector("#dialogBody"),
      closeDialog: document.querySelector("#closeDialog")
    };

    let state = null;
    let pollTimer = null;
    let currentFilter = "pending";
    let currentStatus = "all";
    let currentPriority = "all";
    let currentEnvironment = "all";
    let currentProject = "all";
    let currentProfile = "all";
    let currentQuery = "";
    let activeHeaderFilter = null;
    let availableProjects = [];
    let archivingTaskId = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function statusClass(status) {
      return `status-${String(status).toLowerCase().replaceAll("_", "-")}`;
    }

    function setConnection(mode, label) {
      elements.connection.dataset.state = mode;
      elements.connectionLabel.textContent = label;
    }

    function showNotice(message) {
      elements.noticeText.textContent = message;
      elements.notice.classList.add("is-visible");
    }

    function hideNotice() {
      elements.notice.classList.remove("is-visible");
    }

    async function copyTaskId(taskId, button) {
      const feedback = button.querySelector(".copy-feedback");
      const setFeedback = (stateName, message) => {
        button.dataset.copyState = stateName;
        feedback.textContent = message;
        window.setTimeout(() => {
          if (button.dataset.copyState === stateName) delete button.dataset.copyState;
        }, 1800);
      };

      try {
        if (!navigator.clipboard?.writeText) throw new Error("剪贴板不可用");
        await navigator.clipboard.writeText(taskId);
        setFeedback("success", "已复制");
      } catch {
        setFeedback("failed", "复制失败");
      }
    }

    function formatDate(value, includeDate = true) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间无效";
      return new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        month: includeDate ? "2-digit" : undefined,
        day: includeDate ? "2-digit" : undefined,
        hour: "2-digit",
        minute: "2-digit",
        second: includeDate ? undefined : "2-digit",
        hour12: false
      }).format(date);
    }

    function formatWorkspaceUpdated(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间无效";
      const parts = new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);
      const values = Object.fromEntries(parts.filter((part) => part.type !== "literal").map((part) => [part.type, part.value]));
      return `${values.year}-${values.month}-${values.day} ${values.hour}:${values.minute}:${values.second}`;
    }

    function setSettingsDrawer(open) {
      elements.settingsDrawer.classList.toggle("is-open", open);
      elements.settingsDrawer.setAttribute("aria-hidden", String(!open));
      elements.settingsScrim.classList.toggle("is-visible", open);
      elements.settingsScrim.setAttribute("aria-hidden", String(!open));
      elements.openSettings.setAttribute("aria-expanded", String(open));
      if (open) elements.closeSettings.focus();
      else elements.openSettings.focus();
    }

    function formatDuration(start, end) {
      if (!start) return "--";
      const startTime = new Date(start).getTime();
      const endTime = end ? new Date(end).getTime() : Date.now();
      if (!Number.isFinite(startTime) || !Number.isFinite(endTime)) return "--";
      const seconds = Math.max(0, Math.floor((endTime - startTime) / 1000));
      if (seconds < 60) return `${seconds}秒`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}分钟`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}小时 ${minutes % 60}分`;
      return `${Math.floor(hours / 24)}天 ${hours % 24}小时`;
    }

    function formatTaskTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "时间无效";
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Shanghai",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(date);
      const time = Object.fromEntries(parts.map(({ type, value: partValue }) => [type, partValue]));
      return `${time.hour}:${time.minute}`;
    }

    function formatTaskDuration(task) {
      const startTime = new Date(task?.started_at).getTime();
      if (!Number.isFinite(startTime)) return "--";
      if (task.status === "RUNNING") return formatDuration(task.started_at, null);
      const completedTime = new Date(task?.completed_at).getTime();
      return Number.isFinite(completedTime) ? formatDuration(task.started_at, task.completed_at) : "--";
    }

    function taskTimeValue(value) {
      const formatted = formatTaskTime(value);
      return `<span class="task-time-value${formatted === "--" ? " is-placeholder" : ""}">${escapeHtml(formatted)}</span>`;
    }

    function taskDurationValue(task) {
      const formatted = formatTaskDuration(task);
      return `<span class="task-time-value${formatted === "--" ? " is-placeholder" : ""}">${escapeHtml(formatted)}</span>`;
    }

    function formatConflictDetectedAt(value) {
      if (!value) return "检测时间未记录";
      const timestamp = new Date(value);
      return Number.isNaN(timestamp.getTime()) ? "检测时间无效" : formatDate(value);
    }

    function dependencyIndicatorState(task, tasks) {
      const dependencyIds = Array.isArray(task?.depends_on) ? task.depends_on.filter((id) => typeof id === "string" && id.trim()) : [];
      if (!dependencyIds.length) return null;
      const tasksById = new Map((Array.isArray(tasks) ? tasks : [])
        .filter((candidate) => typeof candidate?.id === "string" && candidate.id)
        .map((candidate) => [candidate.id, candidate]));
      const statuses = dependencyIds.map((id) => tasksById.get(id)?.status);
      if (statuses.some((status) => ["DRAFT", "PENDING", "FAILED", "CANCELLED"].includes(status) || !VALID_STATUSES.has(status))) {
        return { color: "red", label: "依赖状态：存在未执行、失败、取消、缺失或异常依赖" };
      }
      if (statuses.some((status) => !["SUCCEEDED", "CONFIRMED"].includes(status))) {
        return { color: "yellow", label: "依赖状态：存在执行中或等待中的依赖" };
      }
      return { color: "green", label: "依赖状态：全部依赖已成功完成" };
    }

    function renderDependencyIndicator(task, tasks) {
      const indicator = dependencyIndicatorState(task, tasks);
      if (!indicator) return "";
      return `<span class="dependency-indicator is-${indicator.color}" role="img" aria-label="${escapeHtml(indicator.label)}" title="${escapeHtml(indicator.label)}"></span>`;
    }

    function conflictGroups(task, tasks) {
      if (task?.status !== "WAITING_CONFLICT" || !Array.isArray(task.conflicts) || task.conflicts.length === 0) return [];
      const tasksById = new Map((Array.isArray(tasks) ? tasks : [])
        .filter((candidate) => typeof candidate?.id === "string" && candidate.id)
        .map((candidate) => [candidate.id, candidate]));
      const groups = new Map();

      task.conflicts.forEach((candidate) => {
        const conflict = candidate && typeof candidate === "object" ? candidate : {};
        const blockerId = typeof conflict.blocker_task_id === "string" ? conflict.blocker_task_id.trim() : "";
        const groupKey = blockerId || "__unknown_blocker__";
        if (!groups.has(groupKey)) {
          const blockerTask = blockerId ? tasksById.get(blockerId) : null;
          const blockerTitle = typeof blockerTask?.title === "string" ? blockerTask.title.trim() : "";
          groups.set(groupKey, { blockerId, blockerTitle, scopes: new Map() });
        }

        const group = groups.get(groupKey);
        const scopeKey = typeof conflict.scope_key === "string" && conflict.scope_key.trim()
          ? conflict.scope_key.trim()
          : "冲突项目未记录";
        if (!group.scopes.has(scopeKey)) group.scopes.set(scopeKey, new Set());
        group.scopes.get(scopeKey).add(formatConflictDetectedAt(conflict.detected_at));
      });

      return [...groups.values()].map((group) => ({
        blockerId: group.blockerId,
        blockerTitle: group.blockerTitle,
        scopes: [...group.scopes.entries()].map(([scopeKey, detectedAt]) => ({
          scopeKey,
          detectedAt: [...detectedAt]
        }))
      }));
    }

    function conflictGroupMarkup(group) {
      const title = group.blockerTitle || (group.blockerId ? "阻塞任务标题未找到" : "未知阻塞任务");
      const blockerId = group.blockerId || "阻塞任务 ID 未记录";
      return `<div class="conflict-group">
        <strong class="conflict-task-title">${escapeHtml(title)}</strong>
        <code class="conflict-task-id" title="${escapeHtml(blockerId)}">${escapeHtml(blockerId)}</code>
        <ul class="conflict-scopes">${group.scopes.map((scope) => `
          <li>
            <code class="conflict-scope" title="${escapeHtml(scope.scopeKey)}">${escapeHtml(scope.scopeKey)}</code>
            <span class="conflict-detected">detected_at：${escapeHtml(scope.detectedAt.join("、"))}</span>
          </li>`).join("")}
        </ul>
      </div>`;
    }

    function renderConflictIndicator(task, tasks) {
      const groups = conflictGroups(task, tasks);
      if (!groups.length) return "";
      const first = groups[0];
      const firstLabel = first.blockerTitle || first.blockerId || "未知阻塞任务";
      const suffix = groups.length > 1 ? ` +${groups.length - 1}` : "";
      const tooltip = groups.map((group) => {
        const title = group.blockerTitle ? `${group.blockerTitle} · ` : "";
        return `${title}${group.blockerId || "阻塞任务 ID 未记录"}`;
      }).join("；");
      return `<details class="conflict-summary">
        <summary title="${escapeHtml(tooltip)}">等待：${escapeHtml(firstLabel)}${escapeHtml(suffix)}</summary>
        <div class="conflict-popover" aria-label="阻塞任务详情">${groups.map(conflictGroupMarkup).join("")}</div>
      </details>`;
    }

    function renderConflictDetails(task, tasks) {
      const groups = conflictGroups(task, tasks);
      if (!groups.length) return "";
      return `<section class="detail-block"><h3>阻塞任务</h3><div class="conflict-detail-list">${groups.map(conflictGroupMarkup).join("")}</div></section>`;
    }

    function taskProjects(task) {
      const scopes = Array.isArray(task.scope) ? task.scope : [];
      const keys = Array.isArray(task.scope_keys) ? task.scope_keys : [];
      const projectScopes = new Map();
      keys.forEach((key, index) => {
        if (typeof key !== "string" || !key.startsWith("project:")) return;
        const project = key.slice("project:".length);
        if (!projectScopes.has(project)) projectScopes.set(project, []);
        projectScopes.get(project).push(String(scopes[index] ?? "").replaceAll("\\", "/"));
      });
      if (projectScopes.size > 1) {
        const loopScopes = projectScopes.get("local-agent-loop") ?? [];
        if (loopScopes.length && loopScopes.every((scope) => scope.startsWith("local-agent-loop/assets/"))) {
          projectScopes.delete("local-agent-loop");
        }
      }
      return [...projectScopes.keys()];
    }

    function projectCell(task) {
      const projects = taskProjects(task);
      if (!projects.length) return '<span class="muted">未识别</span>';
      return `<div class="project-cell">
        ${projects.map((project) => `<span class="project-badge" title="${escapeHtml(project)}">${escapeHtml(project)}</span>`).join("")}
      </div>`;
    }

    function executionConfig(environment, providerId, capabilityLevel, candidate = state) {
      const profile = candidate?.runtime_config?.execution_profiles?.[environment];
      if (environment === "self_hosted_agent") {
        return profile?.providers?.[providerId]?.capabilities?.[capabilityLevel] ?? null;
      }
      return profile?.capabilities?.[capabilityLevel] ?? null;
    }

    function executionConfigLabel(config) {
      if (!config?.model) return "配置不可用";
      return `${config.model} · ${config.reasoning ?? "unknown"} · ${config.attempt_timeout_seconds ?? "--"}s · 重试 ${config.max_retries ?? "--"}`;
    }

    function providerLabel(providerId) {
      return providerId ? ` · ${providerId}` : "";
    }

    function renderProfileLevelHelp() {
      elements.profileLevelTooltip.innerHTML = CAPABILITY_LEVELS.map((level) => {
        const entries = runtimeEnvironmentEntries().flatMap(([environment, runtime]) => {
          if (environment === "self_hosted_agent") {
            return Object.keys(state?.runtime_config?.execution_profiles?.[environment]?.providers ?? {}).map((providerId) => {
              const config = executionConfig(environment, providerId, level);
              return `${runtime.name}${providerLabel(providerId)}: ${executionConfigLabel(config)}`;
            });
          }
          return [`${runtime.name}: ${executionConfigLabel(executionConfig(environment, null, level))}`];
        });
        return `<div class="profile-level-tooltip-item"><strong>${escapeHtml(level)}</strong><span>${escapeHtml(entries.join(" | "))}</span></div>`;
      }).join("");
    }

    function profileCell(task) {
      const config = executionConfig(task.runtime_environment, task.provider_id, task.capability_level);
      return `<span class="profile-badge profile-${escapeHtml(task.capability_level)}" title="${escapeHtml(executionConfigLabel(config))}">${escapeHtml(CAPABILITY_LABELS[task.capability_level] ?? task.capability_level)}</span>`;
    }

    function runtimeEnvironmentEntries(candidate = state) {
      return Object.entries(candidate?.runtime_config?.runtime_environments ?? {});
    }

    function runtimeEnvironmentName(environment) {
      return state?.runtime_config?.runtime_environments?.[environment]?.name ?? environment;
    }

    function environmentCell(task) {
      const environment = task.runtime_environment;
      return `<span class="environment-badge" title="${escapeHtml(`${environment}${providerLabel(task.provider_id)}`)}">${escapeHtml(runtimeEnvironmentName(environment) + providerLabel(task.provider_id))}</span>`;
    }

    function headerFilterOptions(kind, tasks = state?.tasks ?? []) {
      const contextualTasks = tasks.filter((task) => taskMatches(task, kind));
      if (kind === "status") {
        const values = new Set(contextualTasks.map((task) => task.status));
        return [["all", "全部状态"], ...HEADER_FILTER_STATUSES.filter((status) => values.has(status)).map((status) => [status, `${STATUS_LABELS[status]} (${status})`])];
      }
      if (kind === "priority") {
        const values = new Set(contextualTasks.map((task) => task.priority));
        return [["all", "全部优先级"], ...HEADER_FILTER_PRIORITIES.filter((priority) => values.has(priority)).map((priority) => [priority, `${PRIORITY_LABELS[priority]} (${priority})`])];
      }
      if (kind === "project") {
        availableProjects = [...new Set(contextualTasks.flatMap(taskProjects))]
          .sort((left, right) => left.localeCompare(right, "zh-CN"));
        return [["all", "全部项目"], ...availableProjects.map((project) => [project, project])];
      }
      if (kind === "environment") {
        const values = new Set(contextualTasks.map((task) => task.runtime_environment));
        return [["all", "全部环境"], ...runtimeEnvironmentEntries().filter(([environment]) => values.has(environment)).map(([environment, config]) => [environment, config.name])];
      }
      const values = new Set(contextualTasks.map((task) => task.capability_level));
      return [["all", "全部能力等级"], ...CAPABILITY_LEVELS.filter((level) => values.has(level)).map((level) => [level, CAPABILITY_LABELS[level]])];
    }

    function resetInvalidHeaderFilters(tasks) {
      ["status", "priority", "environment", "project", "profile"].forEach((kind) => {
        const selected = selectedHeaderFilterValue(kind);
        const validValues = new Set(headerFilterOptions(kind, tasks).map(([value]) => value));
        if (selected !== "all" && !validValues.has(selected)) setHeaderFilterValue(kind, "all");
      });
    }

    function selectedHeaderFilterValue(kind) {
      if (kind === "status") return currentStatus;
      if (kind === "priority") return currentPriority;
      if (kind === "environment") return currentEnvironment;
      return kind === "project" ? currentProject : currentProfile;
    }

    function renderHeaderFilterButtons() {
      [["status", elements.statusFilter], ["priority", elements.priorityFilter], ["environment", elements.environmentFilter], ["project", elements.projectFilter], ["profile", elements.profileFilter]].forEach(([kind, button]) => {
        const active = selectedHeaderFilterValue(kind) !== "all";
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      if (activeHeaderFilter) renderHeaderFilterMenu();
    }

    function positionHeaderFilterMenu(trigger) {
      const rect = trigger.getBoundingClientRect();
      const menu = elements.headerFilterMenu;
      menu.style.left = `${Math.max(12, Math.min(rect.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 12))}px`;
      menu.style.top = `${Math.min(rect.bottom + 6, window.innerHeight - menu.offsetHeight - 12)}px`;
    }

    function renderHeaderFilterMenu() {
      if (!activeHeaderFilter) return;
      const trigger = elements[`${activeHeaderFilter}Filter`];
      const selected = selectedHeaderFilterValue(activeHeaderFilter);
      elements.headerFilterMenu.innerHTML = headerFilterOptions(activeHeaderFilter).map(([value, label]) => `
        <button class="header-filter-option" type="button" role="menuitemradio" aria-checked="${value === selected}" data-header-filter-kind="${activeHeaderFilter}" data-header-filter-value="${escapeHtml(value)}">${escapeHtml(label)}</button>`).join("");
      elements.headerFilterMenu.hidden = false;
      positionHeaderFilterMenu(trigger);
    }

    function closeHeaderFilterMenu({ restoreFocus = false } = {}) {
      if (!activeHeaderFilter) return;
      const trigger = elements[`${activeHeaderFilter}Filter`];
      activeHeaderFilter = null;
      elements.headerFilterMenu.hidden = true;
      elements.statusFilter.setAttribute("aria-expanded", "false");
      elements.priorityFilter.setAttribute("aria-expanded", "false");
      elements.environmentFilter.setAttribute("aria-expanded", "false");
      elements.projectFilter.setAttribute("aria-expanded", "false");
      elements.profileFilter.setAttribute("aria-expanded", "false");
      if (restoreFocus) trigger.focus();
    }

    function openHeaderFilter(kind) {
      if (activeHeaderFilter === kind) {
        closeHeaderFilterMenu({ restoreFocus: true });
        return;
      }
      activeHeaderFilter = kind;
      elements.statusFilter.setAttribute("aria-expanded", String(kind === "status"));
      elements.priorityFilter.setAttribute("aria-expanded", String(kind === "priority"));
      elements.environmentFilter.setAttribute("aria-expanded", String(kind === "environment"));
      elements.projectFilter.setAttribute("aria-expanded", String(kind === "project"));
      elements.profileFilter.setAttribute("aria-expanded", String(kind === "profile"));
      renderHeaderFilterMenu();
      elements.headerFilterMenu.querySelector(".header-filter-option[aria-checked=\"true\"]")?.focus();
    }

    function setHeaderFilterValue(kind, value) {
      if (kind === "status") currentStatus = value;
      else if (kind === "priority") currentPriority = value;
      else if (kind === "environment") currentEnvironment = value;
      else if (kind === "project") currentProject = value;
      else currentProfile = value;
    }

    function setHeaderFilter(kind, value) {
      setHeaderFilterValue(kind, value);
      closeHeaderFilterMenu({ restoreFocus: true });
      if (state) resetInvalidHeaderFilters(state.tasks);
      renderHeaderFilterButtons();
      if (state) renderTasks(state.tasks);
    }

    function validateState(candidate) {
      const errors = [];
      if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) errors.push("根节点必须是对象");
      if (candidate?.schema_version !== TASK_SCHEMA_VERSION) {
        errors.push(`schema_version 必须为 ${TASK_SCHEMA_VERSION}`);
      }
      if (!candidate?.workspace || !Number.isInteger(candidate.workspace.revision)) errors.push("workspace.revision 无效");
      if (!Array.isArray(candidate?.tasks)) errors.push("tasks 必须是数组");
      if (!Array.isArray(candidate?.agents)) errors.push("agents 必须是数组");
      const environmentConfig = candidate?.runtime_config?.runtime_environments;
      if (!environmentConfig || typeof environmentConfig !== "object" || Array.isArray(environmentConfig) || !Object.keys(environmentConfig).length) {
        errors.push("runtime_config.runtime_environments 无效");
      }
      const validRuntimeEnvironments = new Set(Object.keys(environmentConfig ?? {}));
      for (const [environment, config] of Object.entries(environmentConfig ?? {})) {
        if (!config || typeof config.name !== "string" || !config.name.trim()) errors.push(`运行环境 ${environment} 配置无效`);
      }
      const ids = new Set();
      for (const [index, task] of (candidate?.tasks ?? []).entries()) {
        if (!task?.id || ids.has(task.id)) errors.push(`tasks[${index}].id 缺失或重复`);
        ids.add(task?.id);
        if (!Number.isInteger(task?.row_version) || task.row_version < 1) errors.push(`任务 ${task?.id ?? index} row_version 无效`);
        if (!VALID_STATUSES.has(task?.status)) errors.push(`任务 ${task?.id ?? index} 状态无效`);
        if (!Object.hasOwn(PRIORITY_ORDER, task?.priority)) errors.push(`任务 ${task?.id ?? index} 优先级无效`);
        if (!CAPABILITY_LEVELS.includes(task?.capability_level)) errors.push(`任务 ${task?.id ?? index} 能力等级无效`);
        if (!task?.runtime_environment || !validRuntimeEnvironments.has(task.runtime_environment)) {
          errors.push(`任务 ${task?.id ?? index} 运行环境缺失或未知`);
        }
        if (task?.runtime_environment === "self_hosted_agent" && (!task?.provider_id || !executionConfig(task.runtime_environment, task.provider_id, task.capability_level, candidate))) {
          errors.push(`任务 ${task?.id ?? index} Provider 缺失或未知`);
        }
        if (task?.runtime_environment !== "self_hosted_agent" && task?.provider_id !== null) {
          errors.push(`任务 ${task?.id ?? index} Provider 路由无效`);
        }
        if (task?.depends_on !== undefined && (!Array.isArray(task.depends_on) || task.depends_on.some((id) => typeof id !== "string"))) {
          errors.push(`任务 ${task?.id ?? index} depends_on 无效`);
        }
        if (!Number.isInteger(task?.progress?.percent) || task.progress.percent < 0 || task.progress.percent > 100) {
          errors.push(`任务 ${task?.id ?? index} 进度无效`);
        }
      }
      for (const [index, agent] of (candidate?.agents ?? []).entries()) {
        if (!agent?.runtime_environment || !validRuntimeEnvironments.has(agent.runtime_environment)) {
          errors.push(`活动 execution ${agent?.id ?? index} 运行环境缺失或未知`);
        }
        if (!CAPABILITY_LEVELS.includes(agent?.capability_level)) errors.push(`活动 execution ${agent?.id ?? index} 能力等级无效`);
        if (agent?.runtime_environment === "self_hosted_agent" && (!agent?.provider_id || !executionConfig(agent.runtime_environment, agent.provider_id, agent.capability_level, candidate))) {
          errors.push(`活动 execution ${agent?.id ?? index} Provider 缺失或未知`);
        }
      }
      if (errors.length) throw new Error(errors.join("；"));
      return candidate;
    }

    function applyState(candidate) {
      try {
        state = validateState(candidate);
        render();
        hideNotice();
        setConnection("live", `DB.V.${state.workspace.revision}`);
        return true;
      } catch (error) {
        setConnection("error", "状态响应无效");
        showNotice(`未应用无效内容，页面保留最后一次有效数据。${error instanceof Error ? error.message : String(error)}`);
        return false;
      }
    }

    async function refreshState() {
      try {
        const response = await fetch(STATE_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return applyState(await response.json());
      } catch (error) {
        setConnection("error", "数据库服务不可用");
        showNotice(`无法读取 ${STATE_ENDPOINT}。${error instanceof Error ? error.message : String(error)}`);
        return false;
      }
    }

    function startPolling() {
      stopPolling();
      const interval = Math.max(500, state?.runtime_config?.dashboard?.poll_interval_ms ?? 2000);
      pollTimer = window.setInterval(refreshState, interval);
    }

    function stopPolling() {
      if (pollTimer !== null) window.clearInterval(pollTimer);
      pollTimer = null;
    }

    function taskMatches(task, ignoredHeaderFilter = null) {
      const archived = isArchived(task);
      if (currentFilter === "archived") {
        if (!archived) return false;
      } else if (archived) {
        return false;
      }
      if (currentFilter === "pending" && task.status !== "PENDING") return false;
      if (currentFilter === "active" && !ACTIVE_STATUSES.has(task.status)) return false;
      if (currentFilter === "attention" && !needsAttention(task)) return false;
      if (currentFilter === "closed" && !CLOSED_STATUSES.has(task.status)) return false;
      if (ignoredHeaderFilter !== "status" && currentStatus !== "all" && task.status !== currentStatus) return false;
      if (ignoredHeaderFilter !== "priority" && currentPriority !== "all" && task.priority !== currentPriority) return false;
      if (ignoredHeaderFilter !== "environment" && currentEnvironment !== "all" && task.runtime_environment !== currentEnvironment) return false;
      if (ignoredHeaderFilter !== "project" && currentProject !== "all" && !taskProjects(task).includes(currentProject)) return false;
      if (ignoredHeaderFilter !== "profile" && currentProfile !== "all" && task.capability_level !== currentProfile) return false;
      if (!currentQuery) return true;
      return [task.id, task.title, task.description, ...taskProjects(task)]
        .filter(Boolean)
        .some((value) => String(value).toLocaleLowerCase("zh-CN").includes(currentQuery));
    }

    function isArchived(task) {
      return Boolean(task?.archived_at);
    }

    function canArchiveTask(task) {
      return currentFilter === "closed" && !isArchived(task) && CLOSED_STATUSES.has(task.status);
    }

    function renderTaskAction(task) {
      if (!canArchiveTask(task)) return "";
      const submitting = archivingTaskId === task.id;
      return `<button class="archive-button${submitting ? " is-submitting" : ""}" type="button" data-archive-task-id="${escapeHtml(task.id)}" aria-label="归档任务 ${escapeHtml(task.id)}" title="归档任务"${submitting ? " disabled aria-busy=\"true\"" : ""}><span class="archive-icon" aria-hidden="true">${submitting ? "↻" : "⇩"}</span><span>归档</span></button>`;
    }

    async function archiveTask(taskId) {
      const task = state?.tasks?.find((candidate) => candidate.id === taskId);
      if (!task || !canArchiveTask(task) || archivingTaskId !== null) return;
      const confirmation = task.status === "SUCCEEDED"
        ? `任务 ${task.id} 尚未人工确认。继续将先执行人工确认，再归档该任务。`
        : `确认归档任务 ${task.id}？任务状态和执行记录将保持不变。`;
      if (!window.confirm(confirmation)) return;

      archivingTaskId = task.id;
      renderTasks(state.tasks);
      try {
        const response = await fetch(TASK_ACTION_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: task.id, action: "archive", row_version: task.row_version })
        });
        let payload = null;
        try { payload = await response.json(); } catch { /* HTTP 状态提供降级错误。 */ }
        if (!response.ok || payload?.ok !== true) {
          throw new Error(payload?.error || `HTTP ${response.status}`);
        }
        const refreshed = await refreshState();
        if (!refreshed) showNotice("归档已完成，但列表刷新失败，请稍后重新加载。");
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        await refreshState();
        showNotice(`归档失败：${message}`);
      } finally {
        archivingTaskId = null;
        if (state) renderTasks(state.tasks);
      }
    }

    function isHeartbeatLate(task) {
      if (!ACTIVE_STATUSES.has(task.status) || !task.heartbeat_at) return false;
      const threshold = (state?.settings?.stalled_after_seconds ?? 300) * 1000;
      return Date.now() - new Date(task.heartbeat_at).getTime() > threshold;
    }

    function needsAttention(task) {
      return ATTENTION_STATUSES.has(task.status) || isHeartbeatLate(task);
    }

    function render() {
      const tasks = state?.tasks ?? [];
      const currentTasks = tasks.filter((task) => !isArchived(task));
      const archived = tasks.filter(isArchived).length;
      const counts = currentTasks.reduce((result, task) => {
        result[task.status] = (result[task.status] ?? 0) + 1;
        return result;
      }, {});
      const succeeded = (counts.SUCCEEDED ?? 0) + (counts.CONFIRMED ?? 0);
      const running = (counts.RUNNING ?? 0) + (counts.CLAIMED ?? 0);
      const failed = counts.FAILED ?? 0;
      const attentionTasks = currentTasks.filter(needsAttention);
      const attention = attentionTasks.length;
      const pending = counts.PENDING ?? 0;
      const confirmation = (counts.SUCCEEDED ?? 0) + (counts.CONFIRMED ?? 0);
      const queued = (counts.DRAFT ?? 0) + (counts.PENDING ?? 0) + (counts.CANCELLED ?? 0);
      const total = currentTasks.length;

      elements.metricTotal.textContent = total;
      elements.metricPending.textContent = pending;
      elements.metricRunning.textContent = running;
      elements.metricAttention.textContent = attention;
      elements.metricConfirmation.textContent = confirmation;
      elements.metricArchived.textContent = archived;
      const widths = [succeeded, running, attention, failed, queued].map((value) => total ? `${(value / total) * 100}%` : "0%");
      [...elements.distribution.children].forEach((child, index) => { child.style.width = widths[index]; });
      elements.distribution.setAttribute("aria-label", `任务状态分布：完成 ${succeeded}，执行中 ${running}，需关注 ${attention}，失败 ${failed}，其他 ${queued}`);
